<body class="bg-brand-dark text-white font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-brand-gray bg-brand-dark/95 sticky top-0 z-40 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="font-heading text-xl md:text-2xl font-bold text-white flex items-center gap-2">
                <span class="text-brand-accent">⚡</span> Veille IA & NoCode
            </h1>
            <nav class="flex gap-4 items-center">
                <button id="refreshBtn" class="text-brand-light hover:text-white transition-colors flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">Actualiser</span>
                </button>
                <button id="openDrawerBtn" class="bg-brand-accent hover:bg-blue-600 text-white px-4 py-2 rounded-md font-medium transition-colors text-sm">
                    Gérer les flux
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Filtres -->
        <div class="mb-8 flex flex-wrap gap-3 items-center" id="filtersContainer">
            <button class="filter-btn active bg-brand-accent text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors" data-category="all">
                Tous les articles
            </button>
            <button class="filter-btn bg-brand-gray text-brand-light hover:text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors" data-category="IA">
                Intelligence Artificielle
            </button>
            <button class="filter-btn bg-brand-gray text-brand-light hover:text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors" data-category="NoCode">
                NoCode
            </button>
        </div>

        <!-- Status / Loader -->
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-md bg-brand-gray text-sm flex items-center gap-3"></div>

        <!-- Grille d'articles -->
        <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Articles injectés via JS -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-10 flex justify-center items-center gap-4 hidden">
            <button id="prevPageBtn" class="px-4 py-2 bg-brand-gray rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-700 transition">Précédent</button>
            <span id="pageIndicator" class="text-brand-light text-sm">Page 1</span>
            <button id="nextPageBtn" class="px-4 py-2 bg-brand-gray rounded-md disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-700 transition">Suivant</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-brand-gray py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-brand-light text-sm">
            &copy; <span id="currentYear"></span> Christophe Guillon. Agrégateur statique expérimental.
        </div>
    </footer>

    <!-- Tiroir latéral (Gestion des flux) -->
    <div id="drawerOverlay" class="fixed inset-0 bg-black/60 z-50 hidden backdrop-blur-sm transition-opacity"></div>
    <div id="feedDrawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-brand-dark border-l border-brand-gray z-50 transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-brand-gray flex justify-between items-center bg-brand-dark/95">
            <h2 class="font-heading text-lg font-bold">Gérer les sources</h2>
            <button id="closeDrawerBtn" class="text-brand-light hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-4 border-b border-brand-gray bg-gray-900/50">
            <form id="addFeedForm" class="flex flex-col gap-3">
                <input type="url" id="newFeedUrl" placeholder="URL du flux RSS/Atom" required class="w-full bg-brand-dark border border-brand-gray rounded px-3 py-2 text-sm focus:outline-none focus:border-brand-accent placeholder-gray-500">
                <div class="flex gap-2">
                    <input type="text" id="newFeedName" placeholder="Nom (optionnel)" class="flex-1 bg-brand-dark border border-brand-gray rounded px-3 py-2 text-sm focus:outline-none focus:border-brand-accent placeholder-gray-500">
                    <select id="newFeedCategory" class="w-32 bg-brand-dark border border-brand-gray rounded px-2 py-2 text-sm focus:outline-none">
                        <option value="IA">IA</option>
                        <option value="NoCode">NoCode</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-brand-accent hover:bg-blue-600 text-white py-2 rounded-md font-medium transition text-sm">Ajouter le flux</button>
            </form>
        </div>
        <div class="flex-grow overflow-y-auto p-4">
            <ul id="feedsList" class="space-y-3">
                <!-- Liste des flux injectée via JS -->
            </ul>
        </div>
    </div>

    <!-- Logique JS -->
    <script>
        // --- CONSTANTES & ÉTATS ---
        const FEEDS_STORAGE_KEY = 'cg_feeds_v1';
        const ARTICLES_CACHE_KEY = 'cg_articles_cache_v1';
        
        const defaultFeeds = [
            { name: 'OpenAI Blog', url: 'https://openai.com/blog/rss/', category: 'IA' },
            { name: 'Hugging Face', url: 'https://huggingface.co/blog/feed.xml', category: 'IA' },
            { name: 'Make Blog', url: 'https://www.make.com/en/blog/rss', category: 'NoCode' }
            // Ajoutez ici vos 15 flux par défaut
        ];

        let activeFeeds = [];
        let allArticles = [];
        let filteredArticles = [];
        let currentPage = 1;
        const itemsPerPage = 12;

        // --- UTILITAIRES ---
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        /** Échappe les entités HTML pour éviter l'injection XSS (Issue #7) */
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /** Génère un hash simple pour les IDs d'articles */
        function hashString(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(16);
        }

        /** Normalise un flux et lui attribue un identifiant stable */
        function normalizeFeed(feed, index = 0) {
            const cleanUrl = String(feed?.url || '').trim();
            const fallbackId = cleanUrl
                ? 'feed_' + btoa(unescape(encodeURIComponent(cleanUrl))).replace(/[^a-zA-Z0-9]/g, '').slice(0, 16)
                : `feed_${index}`;
            return {
                id: String(feed?.id || fallbackId).trim(),
                name: String(feed?.name || 'Flux sans nom').trim(),
                url: cleanUrl,
                category: String(feed?.category || 'IA & NoCode').trim(),
                enabled: feed?.enabled !== false
            };
        }

        // --- GESTION DU STORAGE & MIGRATION (Issues #3 & #10) ---
        function migrateFeedsStorage() {
            try {
                const legacyKeys = ['cg_rss_feeds_active', 'cg_rss_feeds_v45', 'cg_rss_feeds_custom'];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('cg_rss_feeds_') && !legacyKeys.includes(key)) legacyKeys.push(key);
                }
                if (localStorage.getItem(FEEDS_STORAGE_KEY) !== null) {
                    legacyKeys.forEach(key => localStorage.removeItem(key));
                    return;
                }
                const priorityOrder = ['cg_rss_feeds_active', 'cg_rss_feeds_v45', 'cg_rss_feeds_custom'];
                let migratedFeeds = null;
                for (const sourceKey of priorityOrder) {
                    const raw = localStorage.getItem(sourceKey);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        migratedFeeds = parsed.filter(item => item && item.url).map((item, idx) => normalizeFeed(item, idx));
                        break;
                    }
                }
                if (migratedFeeds) localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(migratedFeeds));
                legacyKeys.forEach(key => localStorage.removeItem(key));
            } catch (error) { console.error('[Veille CG] Erreur migration:', error); }
        }

        function loadFeeds() {
            migrateFeedsStorage();
            try {
                const raw = localStorage.getItem(FEEDS_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) return parsed.map((item, idx) => normalizeFeed(item, idx));
                }
            } catch (e) { console.error('[Veille CG] Erreur lecture flux:', e); }
            
            const defaults = defaultFeeds.map((item, idx) => normalizeFeed(item, idx));
            saveFeeds(defaults);
            return defaults;
        }

        function saveFeeds(feeds) {
            try {
                const normalized = feeds.map((item, idx) => normalizeFeed(item, idx));
                localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(normalized));
                activeFeeds = normalized;
                renderFeedsList();
            } catch (e) { console.error('[Veille CG] Erreur sauvegarde flux:', e); }
        }

        function saveCachedArticles() {
            try {
                // Issue #4: Trier avant de tronquer pour ne pas perdre les récents
                const sorted = [...allArticles].sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                const truncated = sorted.slice(0, 150); 
                localStorage.setItem(ARTICLES_CACHE_KEY, JSON.stringify(truncated));
            } catch (e) { console.error('[Veille CG] Erreur cache articles:', e); }
        }

        function loadCachedArticles() {
            try {
                const raw = localStorage.getItem(ARTICLES_CACHE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { console.error('[Veille CG] Erreur chargement cache:', e); }
            return [];
        }

        // --- COLLECTE DES DONNÉES (Préparation Architecture Cible) ---
        async function fetchRSS(url) {
            // Proxys en cascade (à remplacer à terme par appel serveur)
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];
            
            for (const proxy of proxies) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const response = await fetch(proxy, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (response.ok) return await response.text();
                } catch (e) {
                    console.warn(`Proxy échoué pour ${url}: ${e.message}`);
                }
            }
            throw new Error("Tous les proxys ont échoué.");
        }

        function parseFeed(xmlString, feed) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlString, "text/xml");
            const items = Array.from(xml.querySelectorAll("item, entry"));
            const newArticles = [];

            items.forEach(item => {
                const titleNode = item.querySelector("title");
                const linkNode = item.querySelector("link");
                const descNode = item.querySelector("description, summary, content");
                const dateNode = item.querySelector("pubDate, published, updated, date");

                let link = linkNode ? (linkNode.textContent || linkNode.getAttribute("href")) : "";
                if (!link) return;

                // Issue #8: Gestion des dates manquantes
                let pubDate = new Date();
                if (dateNode && dateNode.textContent) {
                    const parsedDate = new Date(dateNode.textContent);
                    if (!isNaN(parsedDate.getTime())) pubDate = parsedDate;
                }

                const rawTitle = titleNode ? titleNode.textContent : "Sans titre";
                const rawDesc = descNode ? descNode.textContent.replace(/(<([^>]+)>)/gi, "") : "";

                // Issue #6: feedId attaché à l'article pour intégrité
                newArticles.push({
                    id: hashString(link),
                    feedId: feed.id,
                    feedName: feed.name,
                    title: rawTitle,
                    link: link,
                    description: rawDesc.substring(0, 200) + (rawDesc.length > 200 ? '...' : ''),
                    pubDate: pubDate.toISOString(),
                    category: feed.category
                });
            });
            return newArticles;
        }

        async function syncArticles() {
            showStatus(`<div class="loader"></div> <span>Actualisation des données...</span>`);
            
            // 1. Tenter de charger le JSON centralisé via Github Actions (Architecture cible)
            let serverArticles = [];
            try {
                const response = await fetch('./data/articles.json', { cache: 'no-store' });
                if (response.ok) {
                    serverArticles = await response.json();
                }
            } catch (e) {
                console.info("[Veille CG] articles.json indisponible, mode dynamique/cache activé.");
            }

            allArticles = serverArticles.length > 0 ? serverArticles : loadCachedArticles();
            applyFilters(); 
            
            // 2. Fetch dynamique pour les flux non présents dans articles.json (ou tous si pas de json)
            const feedsToFetch = activeFeeds.filter(f => f.enabled);
            let newFetched = [];

            for (const feed of feedsToFetch) {
                try {
                    const xml = await fetchRSS(feed.url);
                    const articles = parseFeed(xml, feed);
                    newFetched = [...newFetched, ...articles];
                } catch (error) {
                    console.error(`[Veille CG] Impossible de récupérer le flux ${feed.name}`);
                }
            }

            if (newFetched.length > 0) {
                // Déduplication (sur l'URL) et fusion
                const allMap = new Map();
                [...allArticles, ...newFetched].forEach(art => allMap.set(art.link, art));
                
                allArticles = Array.from(allMap.values())
                    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                
                saveCachedArticles();
            }

            hideStatus();
            applyFilters();
        }

        // --- AFFICHAGE & FILTRES ---
        let currentFilter = 'all';

        function applyFilters() {
            // Purge silencieuse des articles orphelins (dont le feedId n'existe plus ou est désactivé)
            const enabledFeedIds = activeFeeds.filter(f => f.enabled).map(f => f.id);
            allArticles = allArticles.filter(art => enabledFeedIds.includes(art.feedId));

            if (currentFilter === 'all') {
                filteredArticles = [...allArticles];
            } else {
                filteredArticles = allArticles.filter(art => art.category === currentFilter);
            }
            
            currentPage = 1;
            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';

            if (filteredArticles.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-brand-light">Aucun article trouvé pour cette catégorie ou vos flux sont vides.</div>`;
                document.getElementById('pagination').classList.add('hidden');
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filteredArticles.slice(startIndex, endIndex);

            paginatedItems.forEach(article => {
                const dateObj = new Date(article.pubDate);
                const dateStr = dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
                
                // Issue #7 : Injection sécurisée
                const safeTitle = escapeHTML(article.title);
                const safeDesc = escapeHTML(article.description);
                const safeFeedName = escapeHTML(article.feedName);

                const card = document.createElement('article');
                card.className = "bg-[#0A1929] border border-brand-gray rounded-xl p-5 hover:border-brand-accent transition flex flex-col h-full";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-xs font-semibold px-2 py-1 rounded bg-brand-gray text-brand-light">${safeFeedName}</span>
                        <span class="text-xs text-brand-light">${dateStr}</span>
                    </div>
                    <h3 class="font-heading font-bold text-lg leading-tight mb-3 flex-grow">
                        <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="hover:text-brand-accent transition">${safeTitle}</a>
                    </h3>
                    <p class="text-sm text-brand-light mb-4 line-clamp-3">${safeDesc}</p>
                    <div class="mt-auto pt-4 border-t border-brand-gray/50">
                        <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="text-brand-accent text-sm font-medium hover:underline inline-flex items-center gap-1">
                            Lire l'article <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination();
        }

        // Issue #5: Pagination corrigée (basée sur filteredArticles)
        function renderPagination() {
            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            const pagContainer = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagContainer.classList.add('hidden');
                return;
            }
            
            pagContainer.classList.remove('hidden');
            document.getElementById('pageIndicator').textContent = `Page ${currentPage} sur ${totalPages}`;
            
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        // --- GESTION DE L'INTERFACE ---
        function showStatus(htmlContent) {
            const status = document.getElementById('statusMessage');
            status.innerHTML = htmlContent;
            status.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        // Tiroir latéral
        const drawer = document.getElementById('feedDrawer');
        const overlay = document.getElementById('drawerOverlay');
        
        function toggleDrawer() {
            const isOpen = !drawer.classList.contains('translate-x-full');
            if (isOpen) {
                drawer.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            } else {
                drawer.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            }
        }

        document.getElementById('openDrawerBtn').addEventListener('click', toggleDrawer);
        document.getElementById('closeDrawerBtn').addEventListener('click', toggleDrawer);
        overlay.addEventListener('click', toggleDrawer);

        // Rendu de la liste des flux
        function renderFeedsList() {
            const list = document.getElementById('feedsList');
            list.innerHTML = '';
            
            activeFeeds.forEach(feed => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-3 bg-brand-gray rounded-md";
                li.innerHTML = `
                    <div class="flex-1 min-w-0 pr-3">
                        <p class="font-medium text-sm truncate">${escapeHTML(feed.name)}</p>
                        <p class="text-xs text-brand-light truncate">${escapeHTML(feed.url)}</p>
                    </div>
                    <div class="flex gap-2 items-center">
                        <button class="delete-feed text-red-400 hover:text-red-300 p-1" data-id="${feed.id}" title="Supprimer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });

            // Boutons supprimer
            document.querySelectorAll('.delete-feed').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const feedId = e.currentTarget.getAttribute('data-id');
                    // Issue #6 : Suppression propre par ID
                    activeFeeds = activeFeeds.filter(f => f.id !== feedId);
                    saveFeeds(activeFeeds);
                    applyFilters(); // Purgera immédiatement les articles orphelins
                });
            });
        }

        // Ajout d'un flux
        document.getElementById('addFeedForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('newFeedUrl').value.trim();
            let name = document.getElementById('newFeedName').value.trim();
            const category = document.getElementById('newFeedCategory').value;
            
            if (!url) return;
            if (!name) name = new URL(url).hostname.replace('www.', '');

            const newFeed = normalizeFeed({ url, name, category, enabled: true }, activeFeeds.length);
            
            if (!activeFeeds.some(f => f.url === newFeed.url)) {
                activeFeeds.push(newFeed);
                saveFeeds(activeFeeds);
                document.getElementById('addFeedForm').reset();
                syncArticles(); // Relance la synchro pour ce flux
            } else {
                alert("Ce flux existe déjà dans votre liste.");
            }
        });

        // Pagination Events
        document.getElementById('prevPageBtn').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; renderArticles(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        });
        document.getElementById('nextPageBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
            if (currentPage < totalPages) { currentPage++; renderArticles(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        });

        // Filtres Events
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-brand-accent', 'text-white');
                    b.classList.add('bg-brand-gray', 'text-brand-light');
                });
                const target = e.currentTarget;
                target.classList.remove('bg-brand-gray', 'text-brand-light');
                target.classList.add('active', 'bg-brand-accent', 'text-white');
                
                currentFilter = target.getAttribute('data-category');
                applyFilters();
            });
        });

        document.getElementById('refreshBtn').addEventListener('click', syncArticles);

        // --- INITIALISATION ---
        function init() {
            activeFeeds = loadFeeds();
            renderFeedsList();
            syncArticles();
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
