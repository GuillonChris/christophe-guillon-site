    <script>
        // =====================================================================

        const FEEDS_STORAGE_KEY = 'cg_feeds_v1';

        const FAVORITES_STORAGE_KEY = 'cg_favorites_v1';
        const VIEW_MODE_STORAGE_KEY = 'cg_view_mode_v1';

        const MAX_CACHED_ARTICLES = 250;
        const RETENTION_DAYS = 30;
        const ITEMS_PER_PAGE = 12;
        const FETCH_CONCURRENCY = 4;

        // 15 flux par défaut (synchronisés avec /data/feeds.json)
        const defaultFeeds = [

            { name: 'The Verge - AI', url: 'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml', category: 'IA', enabled: true },

            { name: 'Blog du Modérateur - IA', url: 'https://www.blogdumoderateur.com/dossier/intelligence-artificielle/feed/', category: 'IA', enabled: true },
            { name: 'ZDNet France - IA', url: 'https://www.zdnet.fr/feeds/rss/actualites/intelligence-artificielle/', category: 'IA', enabled: true },
            { name: 'Make Blog', url: 'https://www.make.com/en/blog/rss.xml', category: 'NoCode', enabled: true },
            { name: 'n8n Blog', url: 'https://blog.n8n.io/rss/', category: 'NoCode', enabled: true },
            { name: 'Zapier Blog', url: 'https://zapier.com/blog/feeds/latest/', category: 'NoCode', enabled: true },
            { name: 'Bubble Blog', url: 'https://bubble.io/blog/rss/', category: 'NoCode', enabled: true },
            { name: 'Webflow Blog', url: 'https://webflow.com/blog/feed.xml', category: 'NoCode', enabled: true },
            { name: 'Airtable Blog', url: 'https://blog.airtable.com/rss/', category: 'NoCode', enabled: true }
        ];

        // =====================================================================
        // 2. ÉTAT DE L'APPLICATION
        // =====================================================================
        let activeFeeds = [];
        let allArticles = [];
        let filteredArticles = [];
        let favoriteIds = new Set();
        const feedStatusMap = new Map();

        let currentCategory = 'all';
        let currentFeedFilter = 'all';
        let currentSearchQuery = '';
        let currentPage = 1;
        let currentViewMode = 'grid'; // 'grid' (vignettes) | 'list' (liste)
        let isSyncing = false;

        document.getElementById('currentYear').textContent = String(new Date().getFullYear());
        document.getElementById('defaultFeedsCountLabel').textContent = String(defaultFeeds.length);

        // =====================================================================
        // 3. UTILITAIRES DE NORMALISATION & SÉCURITÉ (Issues #6, #7, #9)
        // =====================================================================

        /** Génère un identifiant déterministe FNV-1a 32-bit en hexadécimal */
        function hashString(input) {
            let hash = 0x811c9dc5;
            const str = String(input || '');
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193);
            }
            return (hash >>> 0).toString(16).padStart(8, '0');
        }

        /** Normalise une URL en retirant les paramètres de tracking (utm_*, fbclid, etc.) */
        function normalizeUrl(rawUrl) {
            try {
                const parsed = new URL(String(rawUrl || '').trim());
                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                    return '';
                }
                const paramsToDelete = [];
                parsed.searchParams.forEach((_, key) => {
                    const lower = key.toLowerCase();
                    if (lower.startsWith('utm_') || lower === 'fbclid' || lower === 'gclid' || lower === 'ref') {
                        paramsToDelete.push(key);
                    }
                });
                paramsToDelete.forEach((key) => parsed.searchParams.delete(key));
                parsed.hash = '';
                return parsed.toString();
            } catch {
                return '';
            }
        }

        /** Génère un identifiant de flux stable basé sur l'URL normalisée (Issue #6) */
        function buildFeedId(url) {
            const norm = normalizeUrl(url) || String(url || '').trim().toLowerCase();
            return `feed_${hashString(norm)}`;
        }

        /** Normalise un objet flux selon le schéma cible */
        function normalizeFeed(feed, index = 0) {
            const cleanUrl = normalizeUrl(feed?.url) || String(feed?.url || '').trim();
            return {
                id: String(feed?.id || (cleanUrl ? buildFeedId(cleanUrl) : `feed_${index}`)).trim(),
                name: String(feed?.name || 'Flux sans nom').trim(),
                url: cleanUrl,
                category: feed?.category === 'NoCode' ? 'NoCode' : 'IA',
                enabled: feed?.enabled !== false
            };
        }

        /** Décode proprement le HTML externe en texte brut via DOMParser (Issue #7) */
        function extractPlainText(rawHtml, maxLength = 0) {
            if (!rawHtml) return '';
            const doc = new DOMParser().parseFromString(String(rawHtml), 'text/html');
            const text = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
            if (maxLength > 0 && text.length > maxLength) {
                return text.slice(0, maxLength - 1).trimEnd() + '…';
            }
            return text;
        }

        /** Échappe les caractères spéciaux avant insertion dans innerHTML (Issue #7) */
        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /** Vérifie qu'un lien pointe vers un article et non une page index nue (Issue #9) */
        function isArticleDeepLink(url) {
            try {
                const parsed = new URL(url);
                const path = parsed.pathname.replace(/\/+$/, '');
                if (!path || path === '') return false;
                const segments = path.split('/').filter(Boolean);
                if (segments.length <= 2 && /^(tag|tags|category|categories|topic|topics|section|author)$/i.test(segments[0])) {
                    return false;
                }
                return true;
            } catch {
                return false;
            }
        }

        // =====================================================================
        // 4. PERSISTANCE & MIGRATION IDEMPOTENTE (Issues #3, #4, #10)
        // =====================================================================

        /** Migre de façon idempotente les anciennes clés cg_rss_feeds_* vers cg_feeds_v1 */
        function migrateStorage() {
            try {
                const legacyKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('cg_rss_feeds_')) {
                        legacyKeys.push(key);
                    }
                }

                const existingTarget = localStorage.getItem(FEEDS_STORAGE_KEY);
                if (existingTarget !== null) {
                    const parsedExisting = JSON.parse(existingTarget);
                    if (Array.isArray(parsedExisting) && parsedExisting.length > 0) {
                        legacyKeys.forEach((key) => localStorage.removeItem(key));
                        return;
                    }
                }

                const versionedKeys = legacyKeys
                    .filter((k) => /^cg_rss_feeds_v\d+$/.test(k))
                    .sort((a, b) => Number(b.replace('cg_rss_feeds_v', '')) - Number(a.replace('cg_rss_feeds_v', '')));

                const priorityOrder = [
                    'cg_rss_feeds_active',
                    ...versionedKeys,
                    'cg_rss_feeds_custom'
                ];

                let migrated = null;
                for (const sourceKey of priorityOrder) {
                    const raw = localStorage.getItem(sourceKey);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        migrated = parsed
                            .filter((item) => item && item.url)
                            .map((item, idx) => normalizeFeed(item, idx));
                        console.info(`[Veille CG] Migration réussie depuis "${sourceKey}" (${migrated.length} flux).`);
                        break;
                    }
                }

                if (migrated && migrated.length > 0) {
                    localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(migrated));
                    legacyKeys.forEach((key) => localStorage.removeItem(key));
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lors de la migration localStorage :', error);
            }
        }

        function loadFeeds() {
            migrateStorage();
            try {
                const raw = localStorage.getItem(FEEDS_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        const normalized = parsed
                            .filter((item) => item && item.url)
                            .map((item, idx) => normalizeFeed(item, idx));
                        console.info(`[Veille CG] ${normalized.length} flux chargés depuis ${FEEDS_STORAGE_KEY}.`);
                        return normalized;
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture cg_feeds_v1 :', error);
            }

            const defaults = defaultFeeds.map((item, idx) => normalizeFeed(item, idx));
            saveFeeds(defaults, false);
            console.info(`[Veille CG] Initialisation avec ${defaults.length} flux par défaut.`);
            return defaults;
        }

        function saveFeeds(feeds, shouldRender = true) {
            try {
                const normalized = feeds
                    .filter((item) => item && item.url)
                    .map((item, idx) => normalizeFeed(item, idx));
                localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(normalized));
                activeFeeds = normalized;
                if (shouldRender) {
                    renderFeedsList();
                    updateFeedFilterSelect();
                }
                return true;
            } catch (error) {
                console.error('[Veille CG] Échec sauvegarde des flux :', error);
                return false;
            }
        }

        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        favoriteIds = new Set(parsed);
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture favoris :', error);
            }
            updateFavoritesBadge();
        }

        function saveFavorites() {
            try {
                localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(Array.from(favoriteIds)));
                updateFavoritesBadge();
            } catch (error) {
                console.error('[Veille CG] Erreur sauvegarde favoris :', error);
            }
        }

        /** Trie par date décroissante, purge > 30 jours et tronque à 250 articles (Issue #4) */
        function pruneAndSortArticles(articlesList) {
            const nowMs = Date.now();
            const maxAgeMs = RETENTION_DAYS * 24 * 60 * 60 * 1000;
            const dedupMap = new Map();

            articlesList.forEach((art) => {
                if (!art || !art.link) return;
                const cleanLink = normalizeUrl(art.link);
                if (!cleanLink) return;

                if (art.pubDate) {
                    const pubMs = Date.parse(art.pubDate);
                    if (!Number.isNaN(pubMs) && (nowMs - pubMs) > maxAgeMs) {
                        return;
                    }
                }

                dedupMap.set(cleanLink, {
                    ...art,
                    id: art.id || hashString(cleanLink),
                    link: cleanLink
                });
            });

            return Array.from(dedupMap.values())
                .sort((a, b) => {
                    const timeA = a.pubDate ? Date.parse(a.pubDate) : 0;
                    const timeB = b.pubDate ? Date.parse(b.pubDate) : 0;
                    if (timeB !== timeA) return timeB - timeA;
                    const fetchA = a.fetchedAt ? Date.parse(a.fetchedAt) : 0;
                    const fetchB = b.fetchedAt ? Date.parse(b.fetchedAt) : 0;
                    return fetchB - fetchA;
                })
                .slice(0, MAX_CACHED_ARTICLES);
        }

        function loadCachedArticles() {
            try {
                const raw = localStorage.getItem(ARTICLES_CACHE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return pruneAndSortArticles(parsed);
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture cache articles :', error);
            }
            return [];
        }

        function saveCachedArticles() {
            try {
                allArticles = pruneAndSortArticles(allArticles);
                localStorage.setItem(ARTICLES_CACHE_KEY, JSON.stringify(allArticles));
            } catch (error) {
                console.error('[Veille CG] Erreur sauvegarde cache articles :', error);
            }
        }

        // =====================================================================
        // 5. SYNCHRONISATION MANUELLE PC <-> MOBILE (Lien #sync= & Export/Import)
        // =====================================================================

        /** Encode la liste des flux en Base64URL compact (compatible UTF-8) */
        function encodeFeedsPayload(feeds) {
            const compact = feeds.map((f) => ({
                n: f.name,
                u: f.url,
                c: f.category,
                e: f.enabled ? 1 : 0
            }));
            const bytes = new TextEncoder().encode(JSON.stringify(compact));
            let binary = '';
            bytes.forEach((b) => { binary += String.fromCharCode(b); });
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        /** Décode et valide les flux issus d'un lien #sync= */
        function decodeFeedsPayload(encoded) {
            const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
            const padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
            const binary = atob(padded);
            const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
            const parsed = JSON.parse(new TextDecoder().decode(bytes));
            if (!Array.isArray(parsed)) return [];

            return parsed
                .filter((item) => item && typeof item.u === 'string')
                .map((item, idx) => normalizeFeed({
                    name: item.n || 'Flux importé',
                    url: item.u,
                    category: item.c === 'NoCode' ? 'NoCode' : 'IA',
                    enabled: item.e !== 0
                }, idx))
                .filter((f) => Boolean(normalizeUrl(f.url)));
        }

        /** Copie un lien contenant l'état actuel des flux à ouvrir sur téléphone */
        async function copySyncLink() {
            try {
                const payload = encodeFeedsPayload(activeFeeds);
                const baseUrl = window.location.href.split('#')[0];
                const syncUrl = `${baseUrl}#sync=${payload}`;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(syncUrl);
                    showDrawerFeedback('Lien de synchronisation copié ! Ouvrez-le sur votre téléphone.');
                } else {
                    window.prompt('Copiez ce lien et ouvrez-le sur votre téléphone :', syncUrl);
                }
            } catch (error) {
                console.error('[Veille CG] Erreur génération lien synchro :', error);
                showDrawerFeedback('Impossible de générer le lien de synchronisation.', true);
            }
        }

        /** Importe automatiquement les flux présents dans #sync=... à l'ouverture sur mobile */
        function importFeedsFromUrlHash() {
            const hash = window.location.hash || '';
            if (!hash.startsWith('#sync=')) return 0;

            const encoded = hash.slice('#sync='.length).trim();
            if (!encoded) return 0;

            try {
                const importedFeeds = decodeFeedsPayload(encoded);
                if (importedFeeds.length === 0) return 0;

                const byId = new Map(activeFeeds.map((f) => [f.id, f]));
                let changedCount = 0;

                importedFeeds.forEach((feed) => {
                    const existing = byId.get(feed.id);
                    if (!existing) {
                        activeFeeds.push(feed);
                        byId.set(feed.id, feed);
                        changedCount++;
                    } else if (
                        existing.name !== feed.name ||
                        existing.category !== feed.category ||
                        existing.enabled !== feed.enabled
                    ) {
                        existing.name = feed.name;
                        existing.category = feed.category;
                        existing.enabled = feed.enabled;
                        changedCount++;
                    }
                });

                if (changedCount > 0) {
                    saveFeeds(activeFeeds, false);
                    console.info(`[Veille CG] ${changedCount} source(s) synchronisée(s) depuis le lien.`);
                }

                window.history.replaceState(null, '', window.location.pathname + window.location.search);
                return changedCount;
            } catch (error) {
                console.error('[Veille CG] Lien de synchronisation invalide :', error);
                return 0;
            }
        }

        /** Exporte la liste des flux au format JSON */
        function exportFeedsJSON() {
            const blob = new Blob([JSON.stringify(activeFeeds, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'veille-cg-feeds.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        /** Importe un fichier JSON de flux dans cg_feeds_v1 */
        function importFeedsJSON(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(String(reader.result || '[]'));
                    if (!Array.isArray(parsed)) throw new Error('Format JSON invalide');

                    const byId = new Map(activeFeeds.map((f) => [f.id, f]));
                    let addedCount = 0;

                    parsed.forEach((raw, idx) => {
                        if (!raw || !raw.url || !normalizeUrl(raw.url)) return;
                        const norm = normalizeFeed(raw, idx);
                        if (!byId.has(norm.id)) {
                            activeFeeds.push(norm);
                            byId.set(norm.id, norm);
                            addedCount++;
                        }
                    });

                    saveFeeds(activeFeeds, true);
                    showDrawerFeedback(`${addedCount} nouveau(x) flux importé(s). Actualisation…`);
                    syncAllFeeds(true);
                } catch (err) {
                    showDrawerFeedback(`Échec de l'import JSON : ${err.message}`, true);
                }
            };
            reader.readAsText(file);
        }

        // =====================================================================
        // 6. COLLECTE DES DONNÉES (Option b : articles.json + Repli Proxys)
        // =====================================================================

        /** Charge /data/feeds.json et /data/articles.json générés par GitHub Actions */
        async function loadServerData(bypassHttpCache = false) {
            let serverArticles = [];
            const officialFeedIds = new Set();
            const cacheSuffix = bypassHttpCache ? `?t=${Date.now()}` : '';

            try {
                const feedsRes = await fetch(`./data/feeds.json${cacheSuffix}`, { cache: 'no-store' });
                if (feedsRes.ok) {
                    const remoteFeeds = await feedsRes.json();
                    if (Array.isArray(remoteFeeds) && remoteFeeds.length > 0) {
                        const existingById = new Map(activeFeeds.map((f) => [f.id, f]));
                        let updated = false;
                        remoteFeeds.forEach((rf, idx) => {
                            const norm = normalizeFeed(rf, idx);
                            officialFeedIds.add(norm.id);
                            if (!existingById.has(norm.id)) {
                                activeFeeds.push(norm);
                                updated = true;
                            }
                        });
                        if (updated) saveFeeds(activeFeeds);
                    }
                }
            } catch {
                // Fichier optionnel non encore créé
            }

            try {
                const articlesRes = await fetch(`./data/articles.json${cacheSuffix}`, { cache: 'no-store' });
                if (articlesRes.ok) {
                    const remoteArticles = await articlesRes.json();
                    if (Array.isArray(remoteArticles)) {
                        serverArticles = remoteArticles;
                        serverArticles.forEach((a) => {
                            if (a && a.feedId) officialFeedIds.add(a.feedId);
                        });
                        console.info(`[Veille CG] ${serverArticles.length} articles chargés depuis /data/articles.json.`);
                    }
                }
            } catch {
                console.info('[Veille CG] /data/articles.json absent, repli sur le cache local et les proxys.');
            }

            return { serverArticles, officialFeedIds };
        }

        /** Récupère le XML brut d'un flux via proxys en cascade (repli flux visiteurs) */
        async function fetchRSSWithFallback(url) {
            const encoded = encodeURIComponent(url);
            const proxies = [
                { name: 'corsproxy', endpoint: `https://corsproxy.io/?${encoded}`, jsonWrapper: false },
                { name: 'allorigins-get', endpoint: `https://api.allorigins.win/get?url=${encoded}`, jsonWrapper: true },
                { name: 'allorigins-raw', endpoint: `https://api.allorigins.win/raw?url=${encoded}`, jsonWrapper: false },
                { name: 'codetabs', endpoint: `https://api.codetabs.com/v1/proxy?quest=${encoded}`, jsonWrapper: false }
            ];

            const errors = [];
            for (const proxy of proxies) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 8000);
                    const response = await fetch(proxy.endpoint, { signal: controller.signal });
                    clearTimeout(timer);

                    if (!response.ok) {
                        errors.push(`${proxy.name}:HTTP_${response.status}`);
                        continue;
                    }

                    let payloadText = '';
                    if (proxy.jsonWrapper) {
                        const data = await response.json();
                        payloadText = typeof data?.contents === 'string' ? data.contents : '';
                    } else {
                        payloadText = await response.text();
                    }

                    const trimmed = payloadText.trim();
                    if (!trimmed) {
                        errors.push(`${proxy.name}:EMPTY`);
                        continue;
                    }
                    if (/^<!doctype\s+html|^<html/i.test(trimmed)) {
                        errors.push(`${proxy.name}:HTML_BLOCKED`);
                        continue;
                    }

                    return trimmed;
                } catch (err) {
                    errors.push(`${proxy.name}:${err.name === 'AbortError' ? 'TIMEOUT_8S' : err.message}`);
                }
            }

            throw new Error(errors.join(' | '));
        }

        /** Parse un document RSS 2.0 ou Atom selon le modèle de données cible */
        function parseFeedXML(xmlString, feed) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'text/xml');

            if (xmlDoc.querySelector('parsererror')) {
                throw new Error('XML invalide ou HTML bloqué par le serveur distant');
            }

            const entries = Array.from(xmlDoc.querySelectorAll('item, entry'));
            const fetchedAt = new Date().toISOString();
            const parsedArticles = [];

            entries.forEach((entry) => {
                const titleNode = entry.querySelector('title');
                const descNode = entry.querySelector('description, summary, content, encoded');
                const dateNode = entry.querySelector('pubDate, published, updated, date');
                const sourceNode = entry.querySelector('source');

                let rawLink = '';
                const linkNodes = Array.from(entry.querySelectorAll('link'));
                for (const ln of linkNodes) {
                    const rel = ln.getAttribute('rel');
                    const href = ln.getAttribute('href');
                    if (href && (!rel || rel === 'alternate')) {
                        rawLink = href;
                        break;
                    }
                    if (!rawLink && ln.textContent && ln.textContent.trim()) {
                        rawLink = ln.textContent.trim();
                    }
                }

                const cleanLink = normalizeUrl(rawLink);
                if (!cleanLink || !isArticleDeepLink(cleanLink)) return;

                // Issue #8 : pubDate = null si absente ou invalide (jamais new Date())
                let pubDateISO = null;
                if (dateNode && dateNode.textContent) {
                    const parsedTime = Date.parse(dateNode.textContent.trim());
                    if (!Number.isNaN(parsedTime)) {
                        pubDateISO = new Date(parsedTime).toISOString();
                    }
                }

                const title = extractPlainText(titleNode ? titleNode.textContent : '', 220) || 'Article sans titre';
                const description = extractPlainText(descNode ? descNode.textContent : '', 250);
                const source = extractPlainText(sourceNode ? sourceNode.textContent : '', 80) || feed.name;

                parsedArticles.push({
                    id: hashString(cleanLink),
                    feedId: feed.id,
                    feedName: feed.name,
                    source: source,
                    title: title,
                    link: cleanLink,
                    description: description,
                    pubDate: pubDateISO,
                    category: feed.category,
                    fetchedAt: fetchedAt
                });
            });

            return parsedArticles;
        }

        /** Option (b) : /data/articles.json pour les flux officiels, proxys uniquement pour les flux personnalisés */
        async function syncAllFeeds(bypassHttpCache = false) {
            if (isSyncing) return;
            isSyncing = true;

            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin');
            showStatus('<div class="loader"></div><span>Chargement des sources en cours…</span>');

            const { serverArticles, officialFeedIds } = await loadServerData(bypassHttpCache);
            if (serverArticles.length > 0) {
                allArticles = pruneAndSortArticles([...allArticles, ...serverArticles]);
                serverArticles.forEach((art) => {
                    if (art && art.feedId) {
                        const prev = feedStatusMap.get(art.feedId);
                        const prevMs = prev?.checkedAt ? Date.parse(prev.checkedAt) : 0;
                        const artMs = art.fetchedAt ? Date.parse(art.fetchedAt) : 0;
                        if (!prev || artMs >= prevMs) {
                            feedStatusMap.set(art.feedId, {
                                status: 'server',
                                detail: 'Collecté automatiquement via articles.json',
                                checkedAt: art.fetchedAt || new Date().toISOString()
                            });
                        }
                    }
                });
                saveCachedArticles();
                applyFilters(false);
            }

            // En Option (b) : si articles.json est disponible, seuls les flux personnalisés passent par proxy
            const enabledFeeds = activeFeeds.filter((f) => f.enabled);
            const feedsToFetch = serverArticles.length > 0
                ? enabledFeeds.filter((f) => !officialFeedIds.has(f.id))
                : enabledFeeds;

            feedsToFetch.forEach((feed) => {
                feedStatusMap.set(feed.id, {
                    status: 'pending',
                    detail: 'Interrogation des proxys de repli en cours…',
                    checkedAt: feedStatusMap.get(feed.id)?.checkedAt || null
                });
            });
            renderFeedsList();

            let completedCount = 0;
            let successCount = serverArticles.length > 0 ? officialFeedIds.size : 0;

            for (let i = 0; i < feedsToFetch.length; i += FETCH_CONCURRENCY) {
                const batch = feedsToFetch.slice(i, i + FETCH_CONCURRENCY);
                await Promise.allSettled(
                    batch.map(async (feed) => {
                        const checkedAt = new Date().toISOString();
                        try {
                            const xml = await fetchRSSWithFallback(feed.url);
                            const articles = parseFeedXML(xml, feed);
                            if (articles.length > 0) {
                                allArticles = pruneAndSortArticles([...allArticles, ...articles]);
                                feedStatusMap.set(feed.id, {
                                    status: 'ok',
                                    detail: `${articles.length} article(s) récupéré(s) via proxy de repli`,
                                    checkedAt
                                });
                                successCount++;
                            } else {
                                feedStatusMap.set(feed.id, {
                                    status: 'error',
                                    detail: 'Flux valide mais aucun article récent',
                                    checkedAt
                                });
                            }
                        } catch (err) {
                            feedStatusMap.set(feed.id, {
                                status: 'error',
                                detail: err.message,
                                checkedAt
                            });
                            console.warn(`[Veille CG] Flux ignoré (${feed.name}) : ${err.message}`);
                        } finally {
                            completedCount++;
                            showStatus(`<div class="loader"></div><span>Vérification flux personnalisés : ${completedCount}/${feedsToFetch.length}…</span>`);
                        }
                    })
                );

                saveCachedArticles();
                applyFilters(false);
            }

            renderFeedsList();

            const nowStr = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const badge = document.getElementById('lastUpdateBadge');
            badge.textContent = `Mis à jour à ${nowStr} (${Math.min(successCount, enabledFeeds.length)}/${enabledFeeds.length} flux)`;
            badge.classList.remove('hidden');

            refreshIcon.classList.remove('animate-spin');
            hideStatus();
            isSyncing = false;

            if (serverArticles.length === 0) {
                console.info('[Veille CG] Mode proxy navigateur uniquement (/data/articles.json non trouvé sur le dépôt).');
            } else {
                console.info(`[Veille CG] Synchronisation terminée : ${allArticles.length} articles en mémoire.`);
            }
        }

        // =====================================================================
        // 7. ACTIONS UTILISATEUR SUR LES FLUX (Issue #6)
        // =====================================================================

        function renameFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            const proposed = window.prompt('Nouveau nom pour cette source :', target.name);
            if (proposed === null) return;
            const trimmed = proposed.trim();
            if (!trimmed || trimmed === target.name) return;

            target.name = trimmed;
            saveFeeds(activeFeeds);

            allArticles = allArticles.map((art) =>
                art.feedId === feedId ? { ...art, feedName: trimmed } : art
            );
            saveCachedArticles();
            applyFilters(false);
        }

        function deleteFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            activeFeeds = activeFeeds.filter((f) => f.id !== feedId);
            feedStatusMap.delete(feedId);
            saveFeeds(activeFeeds);

            allArticles = allArticles.filter((art) => art.feedId !== feedId);
            saveCachedArticles();

            if (currentFeedFilter === feedId) {
                currentFeedFilter = 'all';
            }
            applyFilters(true);
        }

        function toggleFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            target.enabled = !target.enabled;
            saveFeeds(activeFeeds);
            applyFilters(true);
        }

        function resetDefaultFeeds() {
            if (!window.confirm(`Restaurer les ${defaultFeeds.length} sources par défaut ? Vos flux personnalisés seront remplacés.`)) {
                return;
            }
            feedStatusMap.clear();
            const defaults = defaultFeeds.map((item, idx) => normalizeFeed(item, idx));
            saveFeeds(defaults);
            currentFeedFilter = 'all';
            syncAllFeeds(true);
        }

        function toggleFavorite(articleId) {
            if (favoriteIds.has(articleId)) {
                favoriteIds.delete(articleId);
            } else {
                favoriteIds.add(articleId);
            }
            saveFavorites();
            applyFilters(false);
        }

        // =====================================================================
        // 8. GESTION DES VUES, FRAÎCHEUR DES SOURCES & RENDU DOM
        // =====================================================================

        function loadViewMode() {
            try {
                const saved = localStorage.getItem(VIEW_MODE_STORAGE_KEY);
                if (saved === 'list' || saved === 'grid') {
                    currentViewMode = saved;
                }
            } catch {
                currentViewMode = 'grid';
            }
            applyViewModeUI();

        function applyViewModeUI() {
            const container = document.getElementById('articlesGrid');
            const gridBtn = document.getElementById('viewGridBtn');
            const listBtn = document.getElementById('viewListBtn');
            if (!container || !gridBtn || !listBtn) return;

            const activeClasses = ['bg-brand-accent', 'text-white'];
            const inactiveClasses = ['text-slate-600', 'hover:text-brand-dark'];

            if (currentViewMode === 'list') {
                container.className = 'flex flex-col gap-3';
                listBtn.classList.add(...activeClasses);
                listBtn.classList.remove(...inactiveClasses);
                listBtn.setAttribute('aria-pressed', 'true');

                gridBtn.classList.remove(...activeClasses);
                gridBtn.classList.add(...inactiveClasses);
                gridBtn.setAttribute('aria-pressed', 'false');
            } else {
                container.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';
                gridBtn.classList.add(...activeClasses);
                gridBtn.classList.remove(...inactiveClasses);
                gridBtn.setAttribute('aria-pressed', 'true');

                listBtn.classList.remove(...activeClasses);
                listBtn.classList.add(...inactiveClasses);
                listBtn.setAttribute('aria-pressed', 'false');
            }
        }

        function setViewMode(mode) {
            if (mode !== 'grid' && mode !== 'list') return;
            currentViewMode = mode;
            try {
                localStorage.setItem(VIEW_MODE_STORAGE_KEY, mode);
            } catch (error) {
                console.warn('[Veille CG] Impossible de sauvegarder le mode de vue :', error);
            }
            applyViewModeUI();
            renderArticles();
        }

        /** Formate un horodatage ISO en date et heure lisibles (ex. "18/11 à 11:30") */
        function formatDateTimeShort(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) return '';

            const datePart = date.toLocaleDateString('fr-FR', {
                day: '2-digit',
                month: '2-digit',
                year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
            });
            const timePart = date.toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
            });
            return `${datePart} à ${timePart}`;
        }

        /** Calcule la fraîcheur d'une source (dernier article publié + dernière vérification) */
        function getFeedFreshnessInfo(feedId) {
            const feedArticles = allArticles.filter((art) => art.feedId === feedId);
            let latestPubMs = 0;
            let latestPubIso = null;
            let latestFetchMs = 0;
            let latestFetchIso = null;

            for (const art of feedArticles) {
                if (art.pubDate) {
                    const pubMs = Date.parse(art.pubDate);
                    if (!Number.isNaN(pubMs) && pubMs > latestPubMs) {
                        latestPubMs = pubMs;
                        latestPubIso = art.pubDate;
                    }
                }
                if (art.fetchedAt) {
                    const fetchMs = Date.parse(art.fetchedAt);
                    if (!Number.isNaN(fetchMs) && fetchMs > latestFetchMs) {
                        latestFetchMs = fetchMs;
                        latestFetchIso = art.fetchedAt;
                    }
                }
            }

            const statusEntry = feedStatusMap.get(feedId);
            const checkedIso = statusEntry?.checkedAt || latestFetchIso;

            return {
                articleCount: feedArticles.length,
                latestPubLabel: formatDateTimeShort(latestPubIso),
                checkedLabel: formatDateTimeShort(checkedIso)
            };
        }

        function applyFilters(resetPage = true) {
            const enabledFeedMap = new Map(
                activeFeeds.filter((f) => f.enabled).map((f) => [f.id, f])
            );

            const visibleArticles = allArticles
                .filter((art) => enabledFeedMap.has(art.feedId))
                .map((art) => {
                    const feed = enabledFeedMap.get(art.feedId);
                    return {
                        ...art,
                        feedName: feed.name,
                        category: feed.category
                    };
                });

            filteredArticles = visibleArticles.filter((art) => {
                if (currentCategory === 'favorites' && !favoriteIds.has(art.id)) {
                    return false;
                }
                if (currentCategory !== 'all' && currentCategory !== 'favorites' && art.category !== currentCategory) {
                    return false;
                }
                if (currentFeedFilter !== 'all' && art.feedId !== currentFeedFilter) {
                    return false;
                }
                if (currentSearchQuery) {
                    const haystack = `${art.title} ${art.description} ${art.feedName}`.toLowerCase();
                    if (!haystack.includes(currentSearchQuery)) {
                        return false;
                    }
                }
                return true;
            });

            if (resetPage) {
                currentPage = 1;
            } else {
                const maxPages = Math.max(1, Math.ceil(filteredArticles.length / ITEMS_PER_PAGE));
                if (currentPage > maxPages) currentPage = maxPages;
            }

            renderArticles();
            renderFeedsList();
        }

        function formatDisplayDate(isoDate) {
            if (!isoDate) return 'Date inconnue';
            const parsed = new Date(isoDate);
            if (Number.isNaN(parsed.getTime())) return 'Date inconnue';
            return parsed.toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'short',
                year: parsed.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
            });
        }

        function renderArticles() {
            const grid = document.getElementById('articlesGrid');
            grid.innerHTML = '';

            if (filteredArticles.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 px-4 text-center bg-white border border-slate-200 rounded-xl shadow-xs">
                        <p class="text-brand-dark font-semibold mb-1">Aucun article à afficher</p>
                        <p class="text-sm text-slate-500">Essayez de modifier vos filtres ou cliquez sur « Actualiser » pour interroger vos sources.</p>
                    </div>
                `;
                document.getElementById('pagination').classList.add('hidden');
                return;
            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageSlice = filteredArticles.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            pageSlice.forEach((article) => {
                const isFav = favoriteIds.has(article.id);
                const badgeColor = article.category === 'NoCode'
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                    : 'bg-blue-50 text-blue-700 border-blue-200';

                const card = document.createElement('article');

                if (currentViewMode === 'list') {
                    card.className = 'bg-white border border-slate-200 rounded-lg px-4 py-3.5 hover:border-brand-accent shadow-xs transition flex flex-col sm:flex-row sm:items-center justify-between gap-3';
                    card.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-2 mb-1">
                                <span class="text-xs font-medium px-2 py-0.5 rounded border ${badgeColor}">
                                    ${escapeHTML(article.feedName)}
                                </span>
                                <span class="text-xs text-slate-500">${escapeHTML(formatDisplayDate(article.pubDate))}</span>
                            </div>
                            <h3 class="font-heading font-bold text-base text-brand-dark leading-snug">
                                <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="hover:text-brand-accent transition">
                                    ${escapeHTML(article.title)}
                                </a>
                            </h3>
                            <p class="text-sm text-slate-600 mt-1 line-clamp-1">${escapeHTML(article.description || '')}</p>
                        </div>
                        <div class="flex items-center gap-3 sm:pl-4 flex-shrink-0 border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
                            <button type="button" class="fav-btn text-xs font-medium px-2.5 py-1.5 rounded border border-slate-200 hover:bg-slate-50 transition ${isFav ? 'text-amber-600 border-amber-200 bg-amber-50/60' : 'text-slate-600'}" data-article-id="${escapeHTML(article.id)}" title="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
                                ${isFav ? '★ Favori' : '☆ Favori'}
                            </button>
                            <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="text-brand-accent text-sm font-semibold hover:underline inline-flex items-center gap-1 whitespace-nowrap">
                                <span>Lire</span>
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                </svg>
                            </a>
                        </div>
                    `;
                } else {
                    card.className = 'bg-white border border-slate-200 rounded-xl p-5 hover:border-brand-accent shadow-xs transition flex flex-col h-full';
                    card.innerHTML = `
                        <div class="flex justify-between items-center gap-2 mb-3">
                            <span class="text-xs font-medium px-2.5 py-0.5 rounded border truncate max-w-[68%] ${badgeColor}" title="${escapeHTML(article.feedName)}">
                                ${escapeHTML(article.feedName)}
                            </span>
                            <span class="text-xs text-slate-500 whitespace-nowrap">${escapeHTML(formatDisplayDate(article.pubDate))}</span>
                        </div>
                        <h3 class="font-heading font-bold text-base text-brand-dark leading-snug mb-2.5 flex-grow">
                            <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="hover:text-brand-accent transition">
                                ${escapeHTML(article.title)}
                            </a>
                        </h3>
                        <p class="text-sm text-slate-600 mb-4 line-clamp-3">${escapeHTML(article.description || 'Aucun résumé disponible pour cet article.')}</p>
                        <div class="mt-auto pt-3 border-t border-slate-100 flex justify-between items-center">
                            <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="text-brand-accent text-sm font-semibold hover:underline inline-flex items-center gap-1">
                                <span>Lire</span>
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                </svg>
                            </a>
                            <button type="button" class="fav-btn text-xs font-medium px-2 py-1 rounded hover:bg-slate-100 transition ${isFav ? 'text-amber-600' : 'text-slate-500 hover:text-brand-dark'}" data-article-id="${escapeHTML(article.id)}" title="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
                                ${isFav ? '★ Favori' : '☆ Favori'}
                            </button>
                        </div>
                    `;
                }

                grid.appendChild(card);
            });

            renderPagination();
        }

        /** Issue #5 : Pagination strictement basée sur filteredArticles.length */
        function renderPagination() {
            const totalItems = filteredArticles.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const pagContainer = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagContainer.classList.add('hidden');
                return;
            }

            pagContainer.classList.remove('hidden');
            document.getElementById('pageIndicator').textContent = `Page ${currentPage} sur ${totalPages} (${totalItems} articles)`;
            document.getElementById('prevPageBtn').disabled = currentPage <= 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        function renderFeedsList() {
            const list = document.getElementById('feedsList');
            list.innerHTML = '';

            const enabledCount = activeFeeds.filter((f) => f.enabled).length;
            document.getElementById('activeFeedsCountBadge').textContent = String(enabledCount);
            document.getElementById('drawerFeedsCount').textContent = `${enabledCount}/${activeFeeds.length}`;

            activeFeeds.forEach((feed) => {
                const state = feedStatusMap.get(feed.id);
                const freshness = getFeedFreshnessInfo(feed.id);

                let statusBadge = '';
                if (feed.enabled && state) {
                    if (state.status === 'pending') {
                        statusBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-blue-50 text-brand-accent border border-blue-200">En cours…</span>`;
                    } else if (state.status === 'server') {
                        statusBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200" title="${escapeHTML(state.detail)}">Serveur</span>`;
                    } else if (state.status === 'ok') {
                        statusBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200" title="${escapeHTML(state.detail)}">OK</span>`;
                    } else if (state.status === 'error') {
                        statusBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-200 cursor-help" title="${escapeHTML(state.detail)}">Proxy bloqué</span>`;
                    }
                } else if (feed.enabled && freshness.articleCount > 0) {
                    statusBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">Cache</span>`;
                }

                // Ligne d'horodatage : date/heure du dernier article + dernière vérification
                const metaParts = [];
                if (freshness.latestPubLabel) {
                    metaParts.push(`Dernier article : <strong class="font-medium text-slate-700">${escapeHTML(freshness.latestPubLabel)}</strong> (${freshness.articleCount})`);
                } else if (freshness.articleCount > 0) {
                    metaParts.push(`${freshness.articleCount} article(s) sans date`);
                } else {
                    metaParts.push('Aucun article en mémoire');
                }

                if (freshness.checkedLabel) {
                    metaParts.push(`Vérifié : ${escapeHTML(freshness.checkedLabel)}`);
                }

                const li = document.createElement('li');
                li.className = `flex justify-between items-start gap-2 p-3 rounded-lg border ${feed.enabled ? 'bg-white border-slate-200 shadow-2xs' : 'bg-slate-100/70 border-slate-200/70 opacity-65'}`;

                li.innerHTML = `
                    <label class="flex items-start gap-2.5 flex-1 min-w-0 cursor-pointer">
                        <input type="checkbox" class="toggle-feed mt-1 accent-[#0084FF]" data-feed-id="${escapeHTML(feed.id)}" ${feed.enabled ? 'checked' : ''}>
                        <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-1.5">
                                <p class="font-medium text-sm text-brand-dark truncate">${escapeHTML(feed.name)}</p>
                                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200">${escapeHTML(feed.category)}</span>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-slate-500 truncate mt-0.5">${escapeHTML(feed.url)}</p>
                            <p class="text-[11px] text-slate-500 mt-1 leading-tight">${metaParts.join(' • ')}</p>
                        </div>
                    </label>
                    <div class="flex items-center gap-1 flex-shrink-0">
                        <button type="button" class="rename-feed text-slate-500 hover:text-brand-dark p-1.5 rounded hover:bg-slate-100 transition" data-feed-id="${escapeHTML(feed.id)}" title="Renommer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <button type="button" class="delete-feed text-red-500 hover:text-red-700 p-1.5 rounded hover:bg-red-50 transition" data-feed-id="${escapeHTML(feed.id)}" title="Supprimer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function updateFeedFilterSelect() {
            const select = document.getElementById('feedFilterSelect');
            const previousValue = currentFeedFilter;
            select.innerHTML = '<option value="all">Toutes les sources</option>';

            activeFeeds
                .filter((f) => f.enabled)
                .forEach((feed) => {
                    const opt = document.createElement('option');
                    opt.value = feed.id;
                    opt.textContent = feed.name;
                    select.appendChild(opt);
                });

            if (Array.from(select.options).some((o) => o.value === previousValue)) {
                select.value = previousValue;
            } else {
                currentFeedFilter = 'all';
                select.value = 'all';
            }
        }

        function updateFavoritesBadge() {
            document.getElementById('favoritesCount').textContent = String(favoriteIds.size);
        }

        function showStatus(htmlContent) {
            document.getElementById('statusText').innerHTML = htmlContent;
            document.getElementById('statusMessage').classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusMessage').classList.add('hidden');
        }

        function showDrawerFeedback(message, isError = false) {
            const box = document.getElementById('drawerFeedback');
            box.textContent = message;
            box.className = `mt-2 text-xs px-2.5 py-1.5 rounded ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4500);
        }

        // =====================================================================
        // 9. ÉVÉNEMENTS & INITIALISATION
        // =====================================================================

        function toggleDrawer(forceState) {
            const drawer = document.getElementById('feedDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const shouldOpen = typeof forceState === 'boolean'
                ? forceState
                : drawer.classList.contains('translate-x-full');

            if (shouldOpen) {
                drawer.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                drawer.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function bindEvents() {
            document.getElementById('openDrawerBtn').addEventListener('click', () => toggleDrawer(true));
            document.getElementById('closeDrawerBtn').addEventListener('click', () => toggleDrawer(false));
            document.getElementById('drawerOverlay').addEventListener('click', () => toggleDrawer(false));
            document.getElementById('refreshBtn').addEventListener('click', () => syncAllFeeds(true));
            document.getElementById('resetFeedsBtn').addEventListener('click', resetDefaultFeeds);

            document.getElementById('clearCacheBtn').addEventListener('click', () => {
                localStorage.removeItem(ARTICLES_CACHE_KEY);
                allArticles = [];
                applyFilters(true);
                showDrawerFeedback('Cache local vidé.');
            });

            // Synchronisation PC <-> Mobile (Lien #sync= & Export/Import JSON)
            document.getElementById('copySyncLinkBtn').addEventListener('click', copySyncLink);
            document.getElementById('exportFeedsBtn').addEventListener('click', exportFeedsJSON);
            document.getElementById('importFeedsInput').addEventListener('change', (e) => {
                importFeedsJSON(e.target.files[0]);
                e.target.value = '';
            });

            // Ajout d'un flux personnalisé
            document.getElementById('addFeedForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const rawUrl = document.getElementById('newFeedUrl').value.trim();
                const rawName = document.getElementById('newFeedName').value.trim();
                const category = document.getElementById('newFeedCategory').value;

                const cleanUrl = normalizeUrl(rawUrl);
                if (!cleanUrl) {
                    showDrawerFeedback('URL invalide. Utilisez une adresse http:// ou https://.', true);
                    return;
                }

                const feedId = buildFeedId(cleanUrl);
                if (activeFeeds.some((f) => f.id === feedId)) {
                    showDrawerFeedback('Ce flux est déjà présent dans votre liste.', true);
                    return;
                }

                const name = rawName || new URL(cleanUrl).hostname.replace(/^www\./, '');
                const newFeed = normalizeFeed({ id: feedId, name, url: cleanUrl, category, enabled: true }, activeFeeds.length);

                activeFeeds.push(newFeed);
                saveFeeds(activeFeeds);
                document.getElementById('addFeedForm').reset();
                showDrawerFeedback(`Flux « ${name} » ajouté. Récupération en cours…`);

                const checkedAt = new Date().toISOString();
                try {
                    const xml = await fetchRSSWithFallback(newFeed.url);
                    const articles = parseFeedXML(xml, newFeed);
                    if (articles.length > 0) {
                        feedStatusMap.set(newFeed.id, {
                            status: 'ok',
                            detail: `${articles.length} article(s) récupéré(s) via proxy de repli`,
                            checkedAt
                        });
                        allArticles = pruneAndSortArticles([...allArticles, ...articles]);
                        saveCachedArticles();
                        applyFilters(true);
                        showDrawerFeedback(`${articles.length} articles récupérés pour « ${name} ».`);
                    } else {
                        feedStatusMap.set(newFeed.id, {
                            status: 'error',
                            detail: 'Flux valide mais aucun article récent',
                            checkedAt
                        });
                        renderFeedsList();
                        showDrawerFeedback('Flux ajouté, mais aucun article récent trouvé.', true);
                    }
                } catch (err) {
                    feedStatusMap.set(newFeed.id, {
                        status: 'error',
                        detail: err.message,
                        checkedAt
                    });
                    renderFeedsList();
                    showDrawerFeedback(`Flux sauvegardé, mais lecture impossible pour le moment (${err.message}).`, true);
                }
            });

            // Délégation des actions sur la liste des flux
            document.getElementById('feedsList').addEventListener('click', (e) => {
                const renameBtn = e.target.closest('.rename-feed');
                if (renameBtn) {
                    renameFeed(renameBtn.getAttribute('data-feed-id'));
                    return;
                }
                const deleteBtn = e.target.closest('.delete-feed');
                if (deleteBtn) {
                    deleteFeed(deleteBtn.getAttribute('data-feed-id'));
                }
            });

            document.getElementById('feedsList').addEventListener('change', (e) => {
                const checkbox = e.target.closest('.toggle-feed');
                if (checkbox) {
                    toggleFeed(checkbox.getAttribute('data-feed-id'));
                }
            });

            // Délégation des favoris
            document.getElementById('articlesGrid').addEventListener('click', (e) => {
                const favBtn = e.target.closest('.fav-btn');
                if (favBtn) {
                    toggleFavorite(favBtn.getAttribute('data-article-id'));
                }
            });

            // Filtres par catégorie
            document.querySelectorAll('.filter-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach((b) => {
                        b.classList.remove('active', 'bg-brand-accent', 'text-white', 'shadow-sm');
                        b.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
                    target.classList.add('active', 'bg-brand-accent', 'text-white', 'shadow-sm');

                    currentCategory = target.getAttribute('data-category');
                    applyFilters(true);
                });
            });

            // Bascule Vignettes / Liste
            document.getElementById('viewGridBtn').addEventListener('click', () => setViewMode('grid'));
            document.getElementById('viewListBtn').addEventListener('click', () => setViewMode('list'));

            // Filtre par source et recherche
            document.getElementById('feedFilterSelect').addEventListener('change', (e) => {
                currentFeedFilter = e.target.value;
                applyFilters(true);
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value.trim().toLowerCase();
                applyFilters(true);
            });

            // Pagination
            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderArticles();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderArticles();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function init() {
            loadViewMode();
            loadFavorites();
            activeFeeds = loadFeeds();

            // Importe les flux si la page est ouverte via un lien #sync=... depuis le PC
            const syncedFromLink = importFeedsFromUrlHash();

            renderFeedsList();
            updateFeedFilterSelect();

            // Affichage immédiat du cache localStorage avant toute requête réseau
            allArticles = loadCachedArticles();
            applyFilters(true);

            bindEvents();
            syncAllFeeds(false);

            if (syncedFromLink > 0) {
                showStatus(`<div class="loader"></div><span>${syncedFromLink} source(s) synchronisée(s) depuis votre lien…</span>`);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
