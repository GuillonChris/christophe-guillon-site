    <script>
        // =====================================================================
        // 1. CONSTANTES & CONFIGURATION
        // =====================================================================
        const FEEDS_STORAGE_KEY = 'cg_feeds_v1';
        const ARTICLES_CACHE_KEY = 'cg_articles_cache_v1';
        const FAVORITES_STORAGE_KEY = 'cg_favorites_v1';

        const MAX_CACHED_ARTICLES = 250;
        const RETENTION_DAYS = 30;
        const ITEMS_PER_PAGE = 12;
        const FETCH_CONCURRENCY = 4;

        // 15 flux par défaut (modifiables librement ou via /data/feeds.json)
        const defaultFeeds = [
            { name: 'OpenAI News', url: 'https://openai.com/news/rss.xml', category: 'IA', enabled: true },
            { name: 'Hugging Face Blog', url: 'https://huggingface.co/blog/feed.xml', category: 'IA', enabled: true },
            { name: 'Google AI Blog', url: 'https://blog.google/technology/ai/rss/', category: 'IA', enabled: true },
            { name: 'Simon Willison Weblog', url: 'https://simonwillison.net/atom/everything/', category: 'IA', enabled: true },
            { name: 'MIT Tech Review - IA', url: 'https://www.technologyreview.com/topic/artificial-intelligence/feed', category: 'IA', enabled: true },
            { name: 'The Verge - AI', url: 'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml', category: 'IA', enabled: true },
            { name: 'ActuIA', url: 'https://www.actuia.com/feed/', category: 'IA', enabled: true },
            { name: 'Blog du Modérateur - IA', url: 'https://www.blogdumoderateur.com/dossier/intelligence-artificielle/feed/', category: 'IA', enabled: true },
            { name: 'ZDNet France - IA', url: 'https://www.zdnet.fr/feeds/rss/actualites/intelligence-artificielle/', category: 'IA', enabled: true },
            { name: 'Make Blog', url: 'https://www.make.com/en/blog/rss.xml', category: 'NoCode', enabled: true },
            { name: 'n8n Blog', url: 'https://blog.n8n.io/rss/', category: 'NoCode', enabled: true },
            { name: 'Zapier Blog', url: 'https://zapier.com/blog/feeds/latest/', category: 'NoCode', enabled: true },
            { name: 'Bubble Blog', url: 'https://bubble.io/blog/rss/', category: 'NoCode', enabled: true },
            { name: 'Webflow Blog', url: 'https://webflow.com/blog/feed.xml', category: 'NoCode', enabled: true },
            { name: 'Airtable Blog', url: 'https://blog.airtable.com/rss/', category: 'NoCode', enabled: true }
        ];

        // =====================================================================
        // 2. ÉTAT DE L'APPLICATION
        // =====================================================================
        let activeFeeds = [];
        let allArticles = [];
        let filteredArticles = [];
        let favoriteIds = new Set();

        let currentCategory = 'all';
        let currentFeedFilter = 'all';
        let currentSearchQuery = '';
        let currentPage = 1;
        let isSyncing = false;

        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // =====================================================================
        // 3. UTILITAIRES DE NORMALISATION & SÉCURITÉ (Issues #6, #7, #9)
        // =====================================================================

        /** Génère un identifiant déterministe FNV-1a 32-bit en hexadécimal */
        function hashString(input) {
            let hash = 0x811c9dc5;
            const str = String(input || '');
            for (let i = 0; i < str.length; i++) {
                hash ^= str.charCodeAt(i);
                hash = Math.imul(hash, 0x01000193);
            }
            return (hash >>> 0).toString(16).padStart(8, '0');
        }

        /** Normalise une URL en retirant les paramètres de tracking (utm_*, fbclid, etc.) */
        function normalizeUrl(rawUrl) {
            try {
                const parsed = new URL(String(rawUrl || '').trim());
                if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
                    return '';
                }
                const paramsToDelete = [];
                parsed.searchParams.forEach((_, key) => {
                    const lower = key.toLowerCase();
                    if (lower.startsWith('utm_') || lower === 'fbclid' || lower === 'gclid' || lower === 'ref') {
                        paramsToDelete.push(key);
                    }
                });
                paramsToDelete.forEach((key) => parsed.searchParams.delete(key));
                parsed.hash = '';
                return parsed.toString();
            } catch {
                return '';
            }
        }

        /** Génère un identifiant de flux stable basé sur l'URL normalisée (Issue #6) */
        function buildFeedId(url) {
            const norm = normalizeUrl(url) || String(url || '').trim().toLowerCase();
            return `feed_${hashString(norm)}`;
        }

        /** Normalise un objet flux selon le schéma cible */
        function normalizeFeed(feed, index = 0) {
            const cleanUrl = normalizeUrl(feed?.url) || String(feed?.url || '').trim();
            return {
                id: String(feed?.id || (cleanUrl ? buildFeedId(cleanUrl) : `feed_${index}`)).trim(),
                name: String(feed?.name || 'Flux sans nom').trim(),
                url: cleanUrl,
                category: feed?.category === 'NoCode' ? 'NoCode' : 'IA',
                enabled: feed?.enabled !== false
            };
        }

        /** Décode proprement le HTML externe en texte brut via DOMParser (Issue #7) */
        function extractPlainText(rawHtml, maxLength = 0) {
            if (!rawHtml) return '';
            const doc = new DOMParser().parseFromString(String(rawHtml), 'text/html');
            const text = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
            if (maxLength > 0 && text.length > maxLength) {
                return text.slice(0, maxLength - 1).trimEnd() + '…';
            }
            return text;
        }

        /** Échappe les caractères spéciaux avant insertion dans innerHTML (Issue #7) */
        function escapeHTML(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /** Vérifie qu'un lien pointe vers un article et non une racine ou page index nue (Issue #9) */
        function isArticleDeepLink(url) {
            try {
                const parsed = new URL(url);
                const path = parsed.pathname.replace(/\/+$/, '');
                if (!path || path === '') return false;
                const segments = path.split('/').filter(Boolean);
                // Rejette uniquement les pages d'index taxonomiques à 1 ou 2 segments courts sans slug d'article
                if (segments.length <= 2 && /^(tag|tags|category|categories|topic|topics|section|author)$/i.test(segments[0])) {
                    return false;
                }
                return true;
            } catch {
                return false;
            }
        }

        // =====================================================================
        // 4. PERSISTANCE & MIGRATION IDEMPOTENTE (Issues #3, #4, #10)
        // =====================================================================

        /** Migre de façon idempotente les anciennes clés cg_rss_feeds_* vers cg_feeds_v1 */
        function migrateStorage() {
            try {
                const legacyKeys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith('cg_rss_feeds_')) {
                        legacyKeys.push(key);
                    }
                }

                // Si la clé cible existe déjà avec des données valides, purge uniquement les résidus
                const existingTarget = localStorage.getItem(FEEDS_STORAGE_KEY);
                if (existingTarget !== null) {
                    const parsedExisting = JSON.parse(existingTarget);
                    if (Array.isArray(parsedExisting) && parsedExisting.length > 0) {
                        legacyKeys.forEach((key) => localStorage.removeItem(key));
                        return;
                    }
                }

                // Ordre de priorité : cg_rss_feeds_active d'abord, puis versions décroissantes, puis custom
                const versionedKeys = legacyKeys
                    .filter((k) => /^cg_rss_feeds_v\d+$/.test(k))
                    .sort((a, b) => Number(b.replace('cg_rss_feeds_v', '')) - Number(a.replace('cg_rss_feeds_v', '')));

                const priorityOrder = [
                    'cg_rss_feeds_active',
                    ...versionedKeys,
                    'cg_rss_feeds_custom'
                ];

                let migrated = null;
                for (const sourceKey of priorityOrder) {
                    const raw = localStorage.getItem(sourceKey);
                    if (!raw) continue;
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        migrated = parsed
                            .filter((item) => item && item.url)
                            .map((item, idx) => normalizeFeed(item, idx));
                        console.info(`[Veille CG] Migration réussie depuis "${sourceKey}" (${migrated.length} flux).`);
                        break;
                    }
                }

                if (migrated && migrated.length > 0) {
                    localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(migrated));
                    legacyKeys.forEach((key) => localStorage.removeItem(key));
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lors de la migration localStorage :', error);
            }
        }

        function loadFeeds() {
            migrateStorage();
            try {
                const raw = localStorage.getItem(FEEDS_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        const normalized = parsed
                            .filter((item) => item && item.url)
                            .map((item, idx) => normalizeFeed(item, idx));
                        console.info(`[Veille CG] ${normalized.length} flux chargés depuis ${FEEDS_STORAGE_KEY}.`);
                        return normalized;
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture cg_feeds_v1 :', error);
            }

            const defaults = defaultFeeds.map((item, idx) => normalizeFeed(item, idx));
            saveFeeds(defaults, false);
            console.info(`[Veille CG] Initialisation avec ${defaults.length} flux par défaut.`);
            return defaults;
        }

        function saveFeeds(feeds, shouldRender = true) {
            try {
                const normalized = feeds
                    .filter((item) => item && item.url)
                    .map((item, idx) => normalizeFeed(item, idx));
                localStorage.setItem(FEEDS_STORAGE_KEY, JSON.stringify(normalized));
                activeFeeds = normalized;
                if (shouldRender) {
                    renderFeedsList();
                    updateFeedFilterSelect();
                }
                return true;
            } catch (error) {
                console.error('[Veille CG] Échec sauvegarde des flux :', error);
                return false;
            }
        }

        function loadFavorites() {
            try {
                const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        favoriteIds = new Set(parsed);
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture favoris :', error);
            }
            updateFavoritesBadge();
        }

        function saveFavorites() {
            try {
                localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(Array.from(favoriteIds)));
                updateFavoritesBadge();
            } catch (error) {
                console.error('[Veille CG] Erreur sauvegarde favoris :', error);
            }
        }

        /** Trie par date décroissante, purge > 30 jours et tronque à 250 articles (Issue #4) */
        function pruneAndSortArticles(articlesList) {
            const nowMs = Date.now();
            const maxAgeMs = RETENTION_DAYS * 24 * 60 * 60 * 1000;
            const dedupMap = new Map();

            articlesList.forEach((art) => {
                if (!art || !art.link) return;
                const cleanLink = normalizeUrl(art.link);
                if (!cleanLink) return;

                // Purge des articles datés de plus de 30 jours
                if (art.pubDate) {
                    const pubMs = Date.parse(art.pubDate);
                    if (!Number.isNaN(pubMs) && (nowMs - pubMs) > maxAgeMs) {
                        return;
                    }
                }

                dedupMap.set(cleanLink, {
                    ...art,
                    id: art.id || hashString(cleanLink),
                    link: cleanLink
                });
            });

            return Array.from(dedupMap.values())
                .sort((a, b) => {
                    const timeA = a.pubDate ? Date.parse(a.pubDate) : 0;
                    const timeB = b.pubDate ? Date.parse(b.pubDate) : 0;
                    if (timeB !== timeA) return timeB - timeA;
                    const fetchA = a.fetchedAt ? Date.parse(a.fetchedAt) : 0;
                    const fetchB = b.fetchedAt ? Date.parse(b.fetchedAt) : 0;
                    return fetchB - fetchA;
                })
                .slice(0, MAX_CACHED_ARTICLES);
        }

        function loadCachedArticles() {
            try {
                const raw = localStorage.getItem(ARTICLES_CACHE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        return pruneAndSortArticles(parsed);
                    }
                }
            } catch (error) {
                console.error('[Veille CG] Erreur lecture cache articles :', error);
            }
            return [];
        }

        function saveCachedArticles() {
            try {
                allArticles = pruneAndSortArticles(allArticles);
                localStorage.setItem(ARTICLES_CACHE_KEY, JSON.stringify(allArticles));
            } catch (error) {
                console.error('[Veille CG] Erreur sauvegarde cache articles :', error);
            }
        }

        // =====================================================================
        // 5. COLLECTE DES DONNÉES (Architecture Cible + Repli Proxys)
        // =====================================================================

        /** Charge /data/feeds.json et /data/articles.json s'ils existent sur le dépôt */
        async function loadServerData() {
            let serverArticles = [];
            try {
                const feedsRes = await fetch('./data/feeds.json', { cache: 'no-cache' });
                if (feedsRes.ok) {
                    const remoteFeeds = await feedsRes.json();
                    if (Array.isArray(remoteFeeds) && remoteFeeds.length > 0) {
                        const existingById = new Map(activeFeeds.map((f) => [f.id, f]));
                        let updated = false;
                        remoteFeeds.forEach((rf, idx) => {
                            const norm = normalizeFeed(rf, idx);
                            if (!existingById.has(norm.id)) {
                                activeFeeds.push(norm);
                                updated = true;
                            }
                        });
                        if (updated) saveFeeds(activeFeeds);
                    }
                }
            } catch {
                // Fichier optionnel non encore créé
            }

            try {
                const articlesRes = await fetch('./data/articles.json', { cache: 'no-cache' });
                if (articlesRes.ok) {
                    const remoteArticles = await articlesRes.json();
                    if (Array.isArray(remoteArticles)) {
                        serverArticles = remoteArticles;
                        console.info(`[Veille CG] ${serverArticles.length} articles chargés depuis /data/articles.json.`);
                    }
                }
            } catch {
                console.info('[Veille CG] /data/articles.json absent, utilisation du cache et des proxys.');
            }

            return serverArticles;
        }

        /** Récupère le XML brut d'un flux via proxys en cascade avec timeout court (Issue #1) */
        async function fetchRSSWithFallback(url) {
            const encoded = encodeURIComponent(url);
            const proxies = [
                { name: 'corsproxy', endpoint: `https://corsproxy.io/?${encoded}`, jsonWrapper: false },
                { name: 'allorigins-get', endpoint: `https://api.allorigins.win/get?url=${encoded}`, jsonWrapper: true },
                { name: 'allorigins-raw', endpoint: `https://api.allorigins.win/raw?url=${encoded}`, jsonWrapper: false },
                { name: 'codetabs', endpoint: `https://api.codetabs.com/v1/proxy?quest=${encoded}`, jsonWrapper: false }
            ];

            const errors = [];
            for (const proxy of proxies) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000);
                    const response = await fetch(proxy.endpoint, { signal: controller.signal });
                    clearTimeout(timer);

                    if (!response.ok) {
                        errors.push(`${proxy.name}:HTTP_${response.status}`);
                        continue;
                    }

                    if (proxy.jsonWrapper) {
                        const data = await response.json();
                        if (data && typeof data.contents === 'string' && data.contents.trim().length > 0) {
                            return data.contents;
                        }
                        errors.push(`${proxy.name}:EMPTY_WRAPPER`);
                        continue;
                    }

                    const text = await response.text();
                    if (text && text.trim().length > 0) {
                        return text;
                    }
                    errors.push(`${proxy.name}:EMPTY_TEXT`);
                } catch (err) {
                    errors.push(`${proxy.name}:${err.name === 'AbortError' ? 'TIMEOUT' : err.message}`);
                }
            }

            throw new Error(errors.join(' | '));
        }

        /** Parse un document RSS 2.0 ou Atom selon le modèle de données cible */
        function parseFeedXML(xmlString, feed) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlString, 'text/xml');

            if (xmlDoc.querySelector('parsererror')) {
                throw new Error('XML invalide ou HTML bloqué par le serveur distant');
            }

            const entries = Array.from(xmlDoc.querySelectorAll('item, entry'));
            const fetchedAt = new Date().toISOString();
            const parsedArticles = [];

            entries.forEach((entry) => {
                const titleNode = entry.querySelector('title');
                const descNode = entry.querySelector('description, summary, content, encoded');
                const dateNode = entry.querySelector('pubDate, published, updated, date');
                const sourceNode = entry.querySelector('source');

                // Extraction robuste du lien RSS ou Atom (rel="alternate")
                let rawLink = '';
                const linkNodes = Array.from(entry.querySelectorAll('link'));
                for (const ln of linkNodes) {
                    const rel = ln.getAttribute('rel');
                    const href = ln.getAttribute('href');
                    if (href && (!rel || rel === 'alternate')) {
                        rawLink = href;
                        break;
                    }
                    if (!rawLink && ln.textContent && ln.textContent.trim()) {
                        rawLink = ln.textContent.trim();
                    }
                }

                const cleanLink = normalizeUrl(rawLink);
                if (!cleanLink || !isArticleDeepLink(cleanLink)) return;

                // Issue #8 : pubDate = null si absente ou invalide (jamais new Date())
                let pubDateISO = null;
                if (dateNode && dateNode.textContent) {
                    const parsedTime = Date.parse(dateNode.textContent.trim());
                    if (!Number.isNaN(parsedTime)) {
                        pubDateISO = new Date(parsedTime).toISOString();
                    }
                }

                const title = extractPlainText(titleNode ? titleNode.textContent : '', 220) || 'Article sans titre';
                const description = extractPlainText(descNode ? descNode.textContent : '', 250);
                const source = extractPlainText(sourceNode ? sourceNode.textContent : '', 80) || feed.name;

                parsedArticles.push({
                    id: hashString(cleanLink),
                    feedId: feed.id,
                    feedName: feed.name,
                    source: source,
                    title: title,
                    link: cleanLink,
                    description: description,
                    pubDate: pubDateISO,
                    category: feed.category,
                    fetchedAt: fetchedAt
                });
            });

            return parsedArticles;
        }

        /** Synchronise les articles avec rendu progressif par lots */
        async function syncAllFeeds() {
            if (isSyncing) return;
            isSyncing = true;

            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin');
            showStatus('<div class="loader"></div><span>Chargement des sources en cours…</span>');

            // 1. Chargement immédiat depuis /data/articles.json si disponible
            const serverArticles = await loadServerData();
            if (serverArticles.length > 0) {
                allArticles = pruneAndSortArticles([...allArticles, ...serverArticles]);
                saveCachedArticles();
                applyFilters(false);
            }

            // 2. Récupération parallèle par lots pour les flux actifs
            const enabledFeeds = activeFeeds.filter((f) => f.enabled);
            let completedCount = 0;
            let successCount = 0;

            for (let i = 0; i < enabledFeeds.length; i += FETCH_CONCURRENCY) {
                const batch = enabledFeeds.slice(i, i + FETCH_CONCURRENCY);
                await Promise.allSettled(
                    batch.map(async (feed) => {
                        try {
                            const xml = await fetchRSSWithFallback(feed.url);
                            const articles = parseFeedXML(xml, feed);
                            if (articles.length > 0) {
                                allArticles = pruneAndSortArticles([...allArticles, ...articles]);
                                successCount++;
                            }
                        } catch (err) {
                            console.warn(`[Veille CG] Flux ignoré (${feed.name}) : ${err.message}`);
                        } finally {
                            completedCount++;
                            showStatus(`<div class="loader"></div><span>Actualisation : ${completedCount}/${enabledFeeds.length} sources vérifiées…</span>`);
                        }
                    })
                );

                // Mise à jour progressive de l'écran dès chaque lot terminé
                saveCachedArticles();
                applyFilters(false);
            }

            const nowStr = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const badge = document.getElementById('lastUpdateBadge');
            badge.textContent = `Mis à jour à ${nowStr} (${successCount}/${enabledFeeds.length} flux)`;
            badge.classList.remove('hidden');

            refreshIcon.classList.remove('animate-spin');
            hideStatus();
            isSyncing = false;
            console.info(`[Veille CG] Synchronisation terminée : ${allArticles.length} articles en mémoire (${successCount}/${enabledFeeds.length} flux actifs répondent).`);
        }

        // =====================================================================
        // 6. ACTIONS UTILISATEUR SUR LES FLUX (Issue #6)
        // =====================================================================

        function renameFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            const proposed = window.prompt('Nouveau nom pour cette source :', target.name);
            if (proposed === null) return;
            const trimmed = proposed.trim();
            if (!trimmed || trimmed === target.name) return;

            target.name = trimmed;
            saveFeeds(activeFeeds);

            // Mise à jour immédiate de feedName sur tous les articles liés via feedId
            allArticles = allArticles.map((art) =>
                art.feedId === feedId ? { ...art, feedName: trimmed } : art
            );
            saveCachedArticles();
            applyFilters(false);
        }

        function deleteFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            activeFeeds = activeFeeds.filter((f) => f.id !== feedId);
            saveFeeds(activeFeeds);

            // Purge immédiate des articles de ce flux via feedId
            allArticles = allArticles.filter((art) => art.feedId !== feedId);
            saveCachedArticles();

            if (currentFeedFilter === feedId) {
                currentFeedFilter = 'all';
            }
            applyFilters(true);
        }

        function toggleFeed(feedId) {
            const target = activeFeeds.find((f) => f.id === feedId);
            if (!target) return;

            target.enabled = !target.enabled;
            saveFeeds(activeFeeds);
            applyFilters(true);
        }

        function resetDefaultFeeds() {
            if (!window.confirm('Restaurer les 15 sources par défaut ? Vos flux personnalisés seront remplacés.')) {
                return;
            }
            const defaults = defaultFeeds.map((item, idx) => normalizeFeed(item, idx));
            saveFeeds(defaults);
            currentFeedFilter = 'all';
            syncAllFeeds();
        }

        function toggleFavorite(articleId) {
            if (favoriteIds.has(articleId)) {
                favoriteIds.delete(articleId);
            } else {
                favoriteIds.add(articleId);
            }
            saveFavorites();
            applyFilters(false);
        }

        // =====================================================================
        // 7. FILTRAGE, PAGINATION & RENDU DOM (Issues #5, #6, #7, #8)
        // =====================================================================

        function applyFilters(resetPage = true) {
            const enabledFeedMap = new Map(
                activeFeeds.filter((f) => f.enabled).map((f) => [f.id, f])
            );

            // Synchronise les noms de flux et masque les flux désactivés/supprimés
            const visibleArticles = allArticles
                .filter((art) => enabledFeedMap.has(art.feedId))
                .map((art) => {
                    const feed = enabledFeedMap.get(art.feedId);
                    return {
                        ...art,
                        feedName: feed.name,
                        category: feed.category
                    };
                });

            filteredArticles = visibleArticles.filter((art) => {
                if (currentCategory === 'favorites' && !favoriteIds.has(art.id)) {
                    return false;
                }
                if (currentCategory !== 'all' && currentCategory !== 'favorites' && art.category !== currentCategory) {
                    return false;
                }
                if (currentFeedFilter !== 'all' && art.feedId !== currentFeedFilter) {
                    return false;
                }
                if (currentSearchQuery) {
                    const haystack = `${art.title} ${art.description} ${art.feedName}`.toLowerCase();
                    if (!haystack.includes(currentSearchQuery)) {
                        return false;
                    }
                }
                return true;
            });

            if (resetPage) {
                currentPage = 1;
            } else {
                const maxPages = Math.max(1, Math.ceil(filteredArticles.length / ITEMS_PER_PAGE));
                if (currentPage > maxPages) currentPage = maxPages;
            }

            renderArticles();
        }

        function formatDisplayDate(isoDate) {
            if (!isoDate) return 'Date inconnue';
            const parsed = new Date(isoDate);
            if (Number.isNaN(parsed.getTime())) return 'Date inconnue';
            return parsed.toLocaleDateString('fr-FR', {
                day: 'numeric',
                month: 'short',
                year: parsed.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
            });
        }

                    </div>

            }

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;

            pageSlice.forEach((article) => {
                const isFav = favoriteIds.has(article.id);
                const badgeColor = article.category === 'NoCode'

                            ${escapeHTML(article.feedName)}
                        </span>

                    </div>
                    <h3 class="font-heading font-bold text-base leading-snug mb-2.5 flex-grow">
                        <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="hover:text-brand-accent transition">
                            ${escapeHTML(article.title)}
                        </a>
                    </h3>
                    <p class="text-sm text-brand-light mb-4 line-clamp-3">${escapeHTML(article.description || 'Aucun résumé disponible pour cet article.')}</p>
                    <div class="mt-auto pt-3 border-t border-brand-gray/60 flex justify-between items-center">
                        <a href="${escapeHTML(article.link)}" target="_blank" rel="noopener noreferrer" class="text-brand-accent text-sm font-medium hover:underline inline-flex items-center gap-1">
                            <span>Lire</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </a>
                        <button type="button" class="fav-btn text-sm px-2 py-1 rounded hover:bg-brand-gray transition ${isFav ? 'text-brand-yellow' : 'text-brand-light hover:text-white'}" data-article-id="${escapeHTML(article.id)}" title="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
                            ${isFav ? '★ Favori' : '☆ Favori'}

                grid.appendChild(card);

            renderPagination();

        /** Issue #5 : Pagination strictement basée sur filteredArticles.length */
        function renderPagination() {
            const totalItems = filteredArticles.length;
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
            const pagContainer = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagContainer.classList.add('hidden');
                return;
            }

            pagContainer.classList.remove('hidden');
            document.getElementById('pageIndicator').textContent = `Page ${currentPage} sur ${totalPages} (${totalItems} articles)`;
            document.getElementById('prevPageBtn').disabled = currentPage <= 1;
            document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
        }

        function updateFeedFilterSelect() {
            const select = document.getElementById('feedFilterSelect');
            const previousValue = currentFeedFilter;
            select.innerHTML = '<option value="all">Toutes les sources</option>';

            activeFeeds
                .filter((f) => f.enabled)
                .forEach((feed) => {
                    const opt = document.createElement('option');
                    opt.value = feed.id;
                    opt.textContent = feed.name;
                    select.appendChild(opt);
                });

            if (Array.from(select.options).some((o) => o.value === previousValue)) {
                select.value = previousValue;
            } else {
                currentFeedFilter = 'all';
                select.value = 'all';
            }
        }

        function showStatus(htmlContent) {

            document.getElementById('statusMessage').classList.remove('hidden');
        }

            document.getElementById('statusMessage').classList.add('hidden');

        // =====================================================================
        // 8. ÉVÉNEMENTS & INITIALISATION
        // =====================================================================

        function toggleDrawer(forceState) {
            const drawer = document.getElementById('feedDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const shouldOpen = typeof forceState === 'boolean'
                ? forceState
                : drawer.classList.contains('translate-x-full');

            if (shouldOpen) {
                drawer.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                drawer.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function bindEvents() {
            document.getElementById('openDrawerBtn').addEventListener('click', () => toggleDrawer(true));
            document.getElementById('closeDrawerBtn').addEventListener('click', () => toggleDrawer(false));
            document.getElementById('drawerOverlay').addEventListener('click', () => toggleDrawer(false));
            document.getElementById('refreshBtn').addEventListener('click', syncAllFeeds);
            document.getElementById('resetFeedsBtn').addEventListener('click', resetDefaultFeeds);

            document.getElementById('clearCacheBtn').addEventListener('click', () => {
                localStorage.removeItem(ARTICLES_CACHE_KEY);
                allArticles = [];
                applyFilters(true);
                showDrawerFeedback('Cache local vidé.');
            });

            // Ajout d'un flux personnalisé avec validation immédiate
            document.getElementById('addFeedForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const rawUrl = document.getElementById('newFeedUrl').value.trim();
                const rawName = document.getElementById('newFeedName').value.trim();
                const category = document.getElementById('newFeedCategory').value;

                const cleanUrl = normalizeUrl(rawUrl);
                if (!cleanUrl) {
                    showDrawerFeedback('URL invalide. Utilisez une adresse http:// ou https://.', true);
                    return;
                }

                const feedId = buildFeedId(cleanUrl);
                if (activeFeeds.some((f) => f.id === feedId)) {
                    showDrawerFeedback('Ce flux est déjà présent dans votre liste.', true);
                    return;
                }

                const name = rawName || new URL(cleanUrl).hostname.replace(/^www\./, '');
                const newFeed = normalizeFeed({ id: feedId, name, url: cleanUrl, category, enabled: true }, activeFeeds.length);

                activeFeeds.push(newFeed);
                saveFeeds(activeFeeds);
                document.getElementById('addFeedForm').reset();
                showDrawerFeedback(`Flux « ${name} » ajouté. Récupération en cours…`);

                try {
                    const xml = await fetchRSSWithFallback(newFeed.url);
                    const articles = parseFeedXML(xml, newFeed);
                    if (articles.length > 0) {
                        allArticles = pruneAndSortArticles([...allArticles, ...articles]);
                        saveCachedArticles();
                        applyFilters(true);
                        showDrawerFeedback(`${articles.length} articles récupérés pour « ${name} ».`);
                    } else {
                        showDrawerFeedback('Flux ajouté, mais aucun article récent trouvé.', true);
                    }
                } catch (err) {
                    showDrawerFeedback(`Flux sauvegardé, mais lecture impossible pour le moment (${err.message}).`, true);
                }
            });

            // Délégation des actions dans la liste des flux (toggle, renommer, supprimer)
            document.getElementById('feedsList').addEventListener('click', (e) => {
                const renameBtn = e.target.closest('.rename-feed');
                if (renameBtn) {
                    renameFeed(renameBtn.getAttribute('data-feed-id'));
                    return;
                }
                const deleteBtn = e.target.closest('.delete-feed');
                if (deleteBtn) {
                    deleteFeed(deleteBtn.getAttribute('data-feed-id'));
                }
            });

            document.getElementById('feedsList').addEventListener('change', (e) => {
                const checkbox = e.target.closest('.toggle-feed');
                if (checkbox) {
                    toggleFeed(checkbox.getAttribute('data-feed-id'));
                }
            });

            // Délégation des favoris sur la grille
            document.getElementById('articlesGrid').addEventListener('click', (e) => {
                const favBtn = e.target.closest('.fav-btn');
                if (favBtn) {
                    toggleFavorite(favBtn.getAttribute('data-article-id'));
                }
            });

            // Filtres par catégorie
            document.querySelectorAll('.filter-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach((b) => {
                        b.classList.remove('active', 'bg-brand-accent', 'text-white');
                        b.classList.add('bg-brand-gray', 'text-brand-light');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('bg-brand-gray', 'text-brand-light');
                    target.classList.add('active', 'bg-brand-accent', 'text-white');

                    currentCategory = target.getAttribute('data-category');
                    applyFilters(true);
                });
            });

            // Filtre par source et recherche
            document.getElementById('feedFilterSelect').addEventListener('change', (e) => {
                currentFeedFilter = e.target.value;
                applyFilters(true);
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value.trim().toLowerCase();
                applyFilters(true);
            });

            // Pagination
            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderArticles();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredArticles.length / ITEMS_PER_PAGE);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderArticles();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function init() {
            loadFavorites();
            activeFeeds = loadFeeds();
            renderFeedsList();
            updateFeedFilterSelect();

            // Affichage immédiat du cache localStorage avant toute requête réseau
            allArticles = loadCachedArticles();
            applyFilters(true);

            bindEvents();
            syncAllFeeds();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
