<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veille NoCode & IA - Feed Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Défilement fluide et discret */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <!-- En-tête Mobile & Tablette -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 flex items-center justify-between px-4 py-3 md:hidden shadow-sm">
        <div class="flex items-center space-x-2.5">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-sm">
                ⚡
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-900 leading-tight">Veille NoCode & IA</h1>
                <p id="mobile-stats" class="text-xs text-slate-500">0 articles</p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button id="mobile-refresh-btn" class="p-2 text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition-colors" title="Actualiser les flux">
                <svg id="mobile-refresh-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button id="burger-btn" class="p-2 text-slate-700 hover:bg-slate-100 rounded-lg focus:outline-none transition-colors" aria-label="Menu principal">
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <!-- Voile d'ombrage Mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden transition-opacity md:hidden"></div>

        <!-- Tiroir Latéral (Sidebar) -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-80 sm:w-96 bg-white border-r border-slate-200 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-xl md:shadow-none">
            
            <!-- En-tête Barre latérale -->
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-lg font-bold shadow-md shadow-indigo-100">
                        ⚡
                    </div>
                    <div>
                        <h2 class="font-bold text-slate-900 text-lg tracking-tight">Veille Stratégique</h2>
                        <span class="text-xs font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">NoCode & IA</span>
                    </div>
                </div>
                <button id="close-sidebar-btn" class="md:hidden p-1.5 text-slate-400 hover:text-slate-700 rounded-lg hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Contenu défilant des réglages -->
            <div class="flex-1 overflow-y-auto p-5 space-y-6">

                <!-- Recherche et Filtrage direct -->
                <div>
                    <label for="filter-input" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Filtrer les articles</label>
                    <div class="relative">
                        <input type="text" id="filter-input" class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:outline-none transition-all" placeholder="Mot-clé (ex: ChatGPT, Make, Bubble)...">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <button id="clear-search-btn" class="hidden absolute right-2.5 top-3 text-slate-400 hover:text-slate-600">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Thématiques rapides -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Thématiques</label>
                    <div class="flex flex-wrap gap-1.5" id="topic-tags">
                        <button data-tag="" class="tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-indigo-600 text-white transition-colors">Tous</button>
                        <button data-tag="IA" class="tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">🤖 IA</button>
                        <button data-tag="NoCode" class="tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">⚡ NoCode</button>
                        <button data-tag="Outils" class="tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors">🛠️ Outils</button>
                        <button data-tag="favoris" class="tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-amber-50 text-amber-700 hover:bg-amber-100 transition-colors">⭐ Favoris (<span id="fav-count">0</span>)</button>
                    </div>
                </div>

                <!-- Ajout de flux personnalisé -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200/80">
                    <label for="rss-url-input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Ajouter un flux RSS</label>
                    <div class="space-y-2">
                        <input type="url" id="rss-url-input" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://site.fr/feed.xml">
                        <button id="add-feed-btn" class="w-full bg-slate-900 hover:bg-indigo-600 text-white py-2 px-3 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1.5 transition-colors shadow-sm">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                            <span>Ajouter à la veille</span>
                        </button>
                    </div>
                </div>

                <!-- Liste déroulante des flux actifs avec renommage -->
                <details class="group bg-white rounded-2xl border border-slate-200/80 overflow-hidden" open>
                    <summary class="flex items-center justify-between p-3.5 cursor-pointer select-none bg-slate-50/50 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-700">Flux actifs (<span id="feeds-count">0</span>)</span>
                        </div>
                        <svg class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </summary>
                    <div class="p-3 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-2 px-1">
                            <span class="text-[11px] text-slate-400">Cliquez sur un nom pour le renommer</span>
                            <button id="reset-feeds-btn" class="text-[11px] font-medium text-indigo-600 hover:underline">Réinitialiser</button>
                        </div>
                        <ul id="feeds-list" class="space-y-1.5 max-h-56 overflow-y-auto pr-1 text-xs">
                            <!-- Les flux seront injectés ici -->
                        </ul>
                    </div>
                </details>

            </div>

            <!-- Pied de la barre latérale -->
            <div class="p-4 border-t border-slate-100 bg-slate-50/70 flex items-center justify-between text-xs text-slate-500">
                <div class="flex items-center space-x-1.5 truncate">
                    <span id="sync-indicator" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span id="last-updated-text" class="truncate">À jour</span>
                </div>
                <button id="desktop-refresh-btn" class="font-medium text-indigo-600 hover:text-indigo-800 flex items-center space-x-1">
                    <svg id="desktop-refresh-icon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Actualiser</span>
                </button>
            </div>
        </aside>

        <!-- Zone Principale : Flux d'articles -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">

            <!-- Barre d'état et filtres actifs -->
            <div class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <h2 id="main-view-title" class="text-sm sm:text-base font-bold text-slate-900">Dernières actualités</h2>
                    <span id="articles-badge" class="bg-slate-100 text-slate-600 font-semibold text-xs px-2.5 py-0.5 rounded-full border border-slate-200">0</span>
                </div>
                <div class="flex items-center space-x-2 text-xs text-slate-500">
                    <span class="hidden sm:inline">Trié par récence</span>
                    <button id="sync-all-btn" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-2.5 py-1 rounded-lg transition-colors flex items-center space-x-1">
                        <svg id="sync-spin-icon" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span id="sync-btn-text">Synchroniser</span>
                    </button>
                </div>
            </div>

            <!-- Bannière de statut de synchronisation -->
            <div id="sync-status-banner" class="hidden bg-indigo-50/80 border-b border-indigo-100 px-4 py-2 text-xs text-indigo-700 flex items-center justify-between">
                <span id="sync-status-msg" class="flex items-center space-x-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-indigo-600 animate-ping"></span>
                    <span>Synchronisation des flux d'actualité en direct...</span>
                </span>
                <span id="sync-progress" class="font-medium text-indigo-900"></span>
            </div>

            <!-- Liste des Cartes d'Articles -->
            <div id="feed-container" class="flex-1 overflow-y-auto p-3 sm:p-6 space-y-3 sm:space-y-4">
                <!-- Les cartes d'articles seront injectées dynamiquement ici -->
            </div>
        </main>
    </div>

    <!-- Notification Toast Discrète -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-xl shadow-xl transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none flex items-center space-x-2">
        <span id="toast-icon">✓</span>
        <span id="toast-msg">Opération effectuée</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Éléments du DOM
            const feedContainer = document.getElementById('feed-container');
            const filterInput = document.getElementById('filter-input');
            const clearSearchBtn = document.getElementById('clear-search-btn');
            const addFeedBtn = document.getElementById('add-feed-btn');
            const rssUrlInput = document.getElementById('rss-url-input');
            const feedsList = document.getElementById('feeds-list');
            const feedsCountEl = document.getElementById('feeds-count');
            const mobileStatsEl = document.getElementById('mobile-stats');
            const articlesBadge = document.getElementById('articles-badge');
            const lastUpdatedText = document.getElementById('last-updated-text');
            const syncIndicator = document.getElementById('sync-indicator');
            const sidebar = document.getElementById('sidebar');
            const burgerBtn = document.getElementById('burger-btn');
            const closeSidebarBtn = document.getElementById('close-sidebar-btn');
            const overlay = document.getElementById('sidebar-overlay');
            const resetFeedsBtn = document.getElementById('reset-feeds-btn');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const favCountEl = document.getElementById('fav-count');
            const syncStatusBanner = document.getElementById('sync-status-banner');
            const syncStatusMsg = document.getElementById('sync-status-msg');
            const syncProgress = document.getElementById('sync-progress');
            const syncAllBtn = document.getElementById('sync-all-btn');
            const syncSpinIcon = document.getElementById('sync-spin-icon');
            const mobileRefreshBtn = document.getElementById('mobile-refresh-btn');
            const desktopRefreshBtn = document.getElementById('desktop-refresh-btn');

            // 15 flux RSS par défaut configurés selon votre demande
            const defaultFeeds = [
                { id: '1', name: 'Google News IA', url: 'https://news.google.com/rss/search?tbm=nws&q=intelligence+artificielle&scoring=n&hl=fr&gl=FR&ceid=FR:fr', category: 'IA' },
                { id: '2', name: 'Google News NoCode', url: 'https://news.google.com/rss/search?q=nocode+OR+%22no-code%22&hl=fr&gl=FR&ceid=FR:fr', category: 'NoCode' },
                { id: '3', name: 'Euronews IA', url: 'https://fr.euronews.com/rss?level=tag&name=intelligence-artificielle', category: 'IA' },
                { id: '4', name: '01Net IA', url: 'https://www.01net.com/actualites/intelligence-artificielle/feed/', category: 'IA' },
                { id: '5', name: 'Intelligence-Artificielle.com', url: 'https://intelligence-artificielle.com/feed/', category: 'IA' },
                { id: '6', name: 'Journal du Net', url: 'https://www.journaldunet.com/intelligence-artificielle/rss/', category: 'IA' },
                { id: '7', name: 'L\'Usine Digitale', url: 'https://www.usine-digitale.fr/intelligence-artificielle/rss', category: 'IA' },
                { id: '8', name: 'Les Numériques', url: 'https://www.lesnumeriques.com/intelligence-artificielle/rss.xml', category: 'IA' },
                { id: '9', name: 'Monde Tech', url: 'https://mondetech.fr/categories/intelligence-artificielle/feed/', category: 'IA' },
                { id: '10', name: 'Presse Citron IA', url: 'https://www.presse-citron.net/category/intelligence-artificielle/feed/', category: 'IA' },
                { id: '11', name: 'Silicon', url: 'https://www.silicon.fr/rss/data-ia-1372.xml', category: 'IA' },
                { id: '12', name: 'Siècle Digital', url: 'https://siecledigital.fr/intelligence-artificielle/feed/', category: 'IA' },
                { id: '13', name: 'TechnoMedia', url: 'https://www.technomedia.org/feeds/posts/default/-/IA', category: 'IA' },
                { id: '14', name: 'Business Edition', url: 'https://fr.blog.businessdecision.com/datascience/feed/feed/', category: 'IA' },
                { id: '15', name: 'L\'Usine Nouvelle', url: 'https://www.usinenouvelle.com/rss/ia/', category: 'IA' }
            ];

            // Articles garantis au démarrage (évite l'écran blanc si le réseau bloque temporairement)
            const fallbackArticles = [
                {
                    title: "L'impact des agents autonomes et de l'IA générative dans l'automatisation NoCode",
                    link: "https://siecledigital.fr",
                    feedName: "Siècle Digital",
                    pubDate: new Date(Date.now() - 1000 * 60 * 35),
                    description: "Les nouveaux connecteurs NoCode permettent d'orchestrer des agents intelligents capables d'analyser des documents, de générer du code ou de qualifier des leads en temps réel.",
                    category: "NoCode"
                },
                {
                    title: "Régulation de l'IA en Europe : les clés de conformité pour les créateurs et entreprises",
                    link: "https://fr.euronews.com",
                    feedName: "Euronews IA",
                    pubDate: new Date(Date.now() - 1000 * 60 * 90),
                    description: "Analyse des critères d'évaluation des risques et des obligations de transparence pour les modèles d'intelligence artificielle déployés dans les services web.",
                    category: "IA"
                },
                {
                    title: "N8N, Make et Zapier : comparatif des meilleures solutions pour interconnecter les LLM",
                    link: "https://www.usine-digitale.fr",
                    feedName: "L'Usine Digitale",
                    pubDate: new Date(Date.now() - 1000 * 60 * 180),
                    description: "Comment concevoir des flux automatisés résilients associant modèles open source hébergés et APIs de pointe sans écrire une seule ligne de code.",
                    category: "NoCode"
                },
                {
                    title: "OpenAI, Anthropic et Google : la course aux modèles de raisonnement avancé",
                    link: "https://www.journaldunet.com",
                    feedName: "Journal du Net",
                    pubDate: new Date(Date.now() - 1000 * 60 * 240),
                    description: "Les benchmarks démontrent une nette amélioration dans la résolution des problèmes complexes, des mathématiques et de l'ingénierie logicielle.",
                    category: "IA"
                },
                {
                    title: "Créer une application métier complète en 48 heures grâce aux outils NoCode & IA",
                    link: "https://www.presse-citron.net",
                    feedName: "Presse Citron IA",
                    pubDate: new Date(Date.now() - 1000 * 60 * 360),
                    description: "De la modélisation de base de données à la génération des interfaces utilisateurs, découvrez comment accélérer radicalement le time-to-market.",
                    category: "NoCode"
                }
            ];

            // État de l'application
            let rssFeeds = loadFeeds();
            let allArticles = [...fallbackArticles];
            let favorites = JSON.parse(localStorage.getItem('savedFavorites') || '[]');
            let currentTag = '';
            let isSyncing = false;
            const feedStatus = {}; // { feedUrl: 'ok' | 'loading' | 'error' }

            // Chargement initial des flux sauvegardés
            function loadFeeds() {
                try {
                    const saved = localStorage.getItem('rssFeeds_v2');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    }
                } catch (e) {
                    console.error("Erreur lecture storage:", e);
                }
                return defaultFeeds;
            }

            function saveFeeds() {
                localStorage.setItem('rssFeeds_v2', JSON.stringify(rssFeeds));
            }

            function saveFavorites() {
                localStorage.setItem('savedFavorites', JSON.stringify(favorites));
                favCountEl.textContent = favorites.length;
            }

            // Notification toast
            function showToast(message, icon = '✓') {
                toastMsg.textContent = message;
                document.getElementById('toast-icon').textContent = icon;
                toast.classList.remove('translate-y-16', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-16', 'opacity-0');
                }, 2800);
            }

            // Nettoyage sécurisé du texte HTML
            function cleanHtml(rawHtml) {
                if (!rawHtml) return '';
                const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
                const text = doc.body.textContent || "";
                return text.replace(/\s+/g, ' ').trim();
            }

            // Formatage de date relative humaine
            function formatRelativeTime(date) {
                if (!date || isNaN(date.getTime())) return "Récemment";
                const diffMs = Date.now() - date.getTime();
                const diffMin = Math.floor(diffMs / 60000);
                const diffHours = Math.floor(diffMin / 60);
                const diffDays = Math.floor(diffHours / 24);

                if (diffMin < 2) return "À l'instant";
                if (diffMin < 60) return `Il y a ${diffMin} min`;
                if (diffHours < 24) return `Il y a ${diffHours} h`;
                if (diffDays === 1) return `Hier`;
                if (diffDays < 7) return `Il y a ${diffDays} j`;
                return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
            }

            // Rendu de la liste des flux dans la barre latérale
            function renderFeedsList() {
                feedsList.innerHTML = '';
                feedsCountEl.textContent = rssFeeds.length;

                rssFeeds.forEach((feed) => {
                    const status = feedStatus[feed.url] || 'idle';
                    let statusColor = 'bg-slate-300';
                    let statusTitle = 'En attente';

                    if (status === 'loading') {
                        statusColor = 'bg-amber-400 animate-ping';
                        statusTitle = 'Chargement en cours';
                    } else if (status === 'ok') {
                        statusColor = 'bg-emerald-500';
                        statusTitle = 'Flux actif et synchronisé';
                    } else if (status === 'error') {
                        statusColor = 'bg-rose-500';
                        statusTitle = 'Erreur d\'accès au flux';
                    }

                    const li = document.createElement('li');
                    li.className = 'group flex items-center justify-between p-2 rounded-xl hover:bg-slate-100 transition-colors border border-transparent hover:border-slate-200';
                    li.innerHTML = `
                        <div class="flex items-center space-x-2.5 truncate flex-1 min-w-0 pr-2">
                            <span class="w-2 h-2 rounded-full ${statusColor} flex-shrink-0" title="${statusTitle}"></span>
                            <span class="feed-title truncate font-medium text-slate-700 cursor-pointer hover:text-indigo-600" title="Cliquer pour renommer">${feed.name}</span>
                        </div>
                        <div class="flex items-center space-x-1 opacity-80 group-hover:opacity-100">
                            <button class="edit-feed-btn p-1 text-slate-400 hover:text-indigo-600 rounded" title="Renommer">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                </svg>
                            </button>
                            <button class="delete-feed-btn p-1 text-slate-400 hover:text-rose-600 rounded" title="Supprimer">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    `;

                    // Gestion du renommage en ligne
                    const titleSpan = li.querySelector('.feed-title');
                    const editBtn = li.querySelector('.edit-feed-btn');
                    const startEdit = () => {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = feed.name;
                        input.className = 'w-full text-xs font-medium px-2 py-1 bg-white border border-indigo-400 rounded focus:outline-none';
                        titleSpan.replaceWith(input);
                        input.focus();
                        input.select();

                        const finish = () => {
                            const newName = input.value.trim();
                            if (newName && newName !== feed.name) {
                                feed.name = newName;
                                saveFeeds();
                                showToast(`Flux renommé : ${newName}`);
                            }
                            renderFeedsList();
                            renderArticles();
                        };

                        input.addEventListener('blur', finish);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') finish();
                            if (e.key === 'Escape') renderFeedsList();
                        });
                    };

                    titleSpan.addEventListener('click', startEdit);
                    editBtn.addEventListener('click', startEdit);

                    // Gestion de la suppression
                    li.querySelector('.delete-feed-btn').addEventListener('click', () => {
                        rssFeeds = rssFeeds.filter(f => f.url !== feed.url);
                        saveFeeds();
                        allArticles = allArticles.filter(a => a.feedName !== feed.name);
                        renderFeedsList();
                        renderArticles();
                        showToast(`Flux "${feed.name}" supprimé`);
                    });

                    feedsList.appendChild(li);
                });
            }

            // Affichage des articles
            function renderArticles() {
                const query = filterInput.value.toLowerCase().trim();
                
                let filtered = allArticles.filter(article => {
                    const matchQuery = !query || 
                        article.title.toLowerCase().includes(query) ||
                        article.description.toLowerCase().includes(query) ||
                        article.feedName.toLowerCase().includes(query);

                    const isFav = favorites.includes(article.link);

                    let matchTag = true;
                    if (currentTag === 'favoris') {
                        matchTag = isFav;
                    } else if (currentTag === 'IA') {
                        matchTag = (article.category === 'IA' || article.title.toLowerCase().includes('ia') || article.title.toLowerCase().includes('intelligence') || article.description.toLowerCase().includes('ia'));
                    } else if (currentTag === 'NoCode') {
                        matchTag = (article.category === 'NoCode' || article.title.toLowerCase().includes('nocode') || article.title.toLowerCase().includes('no-code') || article.description.toLowerCase().includes('nocode') || article.description.toLowerCase().includes('automatisation'));
                    } else if (currentTag === 'Outils') {
                        matchTag = (article.title.toLowerCase().includes('outil') || article.title.toLowerCase().includes('app') || article.title.toLowerCase().includes('chatgpt') || article.title.toLowerCase().includes('make'));
                    }

                    return matchQuery && matchTag;
                });

                // Tri chronologique
                filtered.sort((a, b) => b.pubDate.getTime() - a.pubDate.getTime());

                articlesBadge.textContent = filtered.length;
                mobileStatsEl.textContent = `${filtered.length} article${filtered.length > 1 ? 's' : ''}`;

                if (filtered.length === 0) {
                    feedContainer.innerHTML = `
                        <div class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center max-w-md mx-auto my-12 shadow-sm">
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                                🔍
                            </div>
                            <h3 class="font-bold text-slate-800 text-base mb-1">Aucun article trouvé</h3>
                            <p class="text-xs text-slate-500 mb-4">Ajustez vos mots-clés ou réinitialisez les filtres pour afficher l'ensemble de votre veille.</p>
                            <button id="reset-filter-btn" class="text-xs font-semibold px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition-colors">
                                Réinitialiser les filtres
                            </button>
                        </div>
                    `;
                    document.getElementById('reset-filter-btn')?.addEventListener('click', () => {
                        filterInput.value = '';
                        currentTag = '';
                        updateTagUI();
                        renderArticles();
                    });
                    return;
                }

                feedContainer.innerHTML = '';
                filtered.forEach(article => {
                    const isFav = favorites.includes(article.link);
                    const card = document.createElement('article');
                    card.className = 'bg-white rounded-2xl border border-slate-200/80 hover:border-indigo-200 p-4 sm:p-5 transition-all duration-200 hover:shadow-md hover:-translate-y-0.5 flex flex-col justify-between';

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-2">
                                <div class="flex items-center space-x-2 truncate">
                                    <span class="inline-flex items-center text-[11px] font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100/60 px-2.5 py-0.5 rounded-full truncate">
                                        ${article.feedName}
                                    </span>
                                    <span class="text-[11px] text-slate-400 font-medium">· ${formatRelativeTime(article.pubDate)}</span>
                                </div>
                                <button class="fav-btn p-1.5 text-slate-300 hover:text-amber-500 transition-colors" title="${isFav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
                                    <svg class="w-4 h-4 ${isFav ? 'text-amber-500 fill-amber-500' : ''}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                                    </svg>
                                </button>
                            </div>
                            <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug mb-2 hover:text-indigo-600 transition-colors">
                                <a href="${article.link}" target="_blank" rel="noopener noreferrer">${article.title}</a>
                            </h3>
                            <p class="text-xs sm:text-sm text-slate-600 line-clamp-2 sm:line-clamp-3 mb-4 leading-relaxed font-normal">
                                ${article.description || 'Cliquez pour lire l\'article complet sur le site d\'origine.'}
                            </p>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                            <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 group">
                                <span>Lire l'article</span>
                                <svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                                </svg>
                            </a>
                            <button class="share-btn text-slate-400 hover:text-slate-700 flex items-center space-x-1 p-1 rounded hover:bg-slate-50 transition-colors" title="Copier le lien">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                                </svg>
                                <span class="hidden sm:inline">Partager</span>
                            </button>
                        </div>
                    `;

                    // Gestion Favoris
                    card.querySelector('.fav-btn').addEventListener('click', () => {
                        const idx = favorites.indexOf(article.link);
                        if (idx > -1) {
                            favorites.splice(idx, 1);
                            showToast("Retiré des favoris");
                        } else {
                            favorites.push(article.link);
                            showToast("Ajouté aux favoris ⭐");
                        }
                        saveFavorites();
                        renderArticles();
                    });

                    // Partage sécurisé (compatible iframe)
                    card.querySelector('.share-btn').addEventListener('click', () => {
                        copyLinkSafely(article.link);
                    });

                    feedContainer.appendChild(card);
                });
            }

            // Copie dans le presse-papier sans dépendance fragile
            function copyLinkSafely(url) {
                const tempInput = document.createElement('textarea');
                tempInput.value = url;
                tempInput.style.position = 'fixed';
                tempInput.style.opacity = '0';
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand('copy');
                    showToast("Lien copié dans le presse-papiers !");
                } catch (e) {
                    showToast("Impossible de copier automatiquement");
                }
                document.body.removeChild(tempInput);
            }

            // Système de récupération multi-proxies avec timeout
            async function fetchRssContent(feedUrl) {
                const proxyEndpoints = [
                    // Proxy 1 : Allorigins JSON (très tolérant au formatage et encodages)
                    async (url) => {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 6000);
                        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        if (data && data.contents && data.contents.includes('<')) return data.contents;
                        throw new Error('Contenu vide');
                    },
                    // Proxy 2 : CodeTabs (simple et direct)
                    async (url) => {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 6000);
                        const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const text = await res.text();
                        if (text && text.includes('<')) return text;
                        throw new Error('Contenu non XML');
                    },
                    // Proxy 3 : Cors.dev
                    async (url) => {
                        const controller = new AbortController();
                        const timer = setTimeout(() => controller.abort(), 6000);
                        const res = await fetch(`https://proxy.cors.dev/${url}`, { signal: controller.signal });
                        clearTimeout(timer);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const text = await res.text();
                        if (text && text.includes('<')) return text;
                        throw new Error('Erreur proxy 3');
                    }
                ];

                let lastErr = null;
                for (const fetcher of proxyEndpoints) {
                    try {
                        const xmlText = await fetcher(feedUrl);
                        if (xmlText && xmlText.length > 50) return xmlText;
                    } catch (e) {
                        lastErr = e;
                    }
                }
                throw lastErr || new Error("Passerelles inaccessibles");
            }

            // Analyseur XML robuste (supporte RSS 2.0, Atom, RDF)
            function parseRssString(xmlString, feed) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "application/xml");

                if (xmlDoc.querySelector("parsererror")) {
                    throw new Error("Format XML invalide");
                }

                const items = xmlDoc.querySelectorAll("item, entry");
                const articles = [];

                items.forEach(node => {
                    const titleNode = node.querySelector("title");
                    const title = titleNode ? cleanHtml(titleNode.textContent) : "Article sans titre";

                    // Détection du lien (balise ou attribut href pour Atom)
                    let link = "#";
                    const linkNode = node.querySelector("link");
                    if (linkNode) {
                        link = linkNode.textContent.trim() || linkNode.getAttribute("href") || "#";
                    }

                    // Description / Extrait
                    const descNode = node.querySelector("description, summary, content");
                    let description = descNode ? cleanHtml(descNode.textContent) : "";
                    if (description.length > 250) {
                        description = description.substring(0, 250) + "…";
                    }

                    // Date de publication
                    const dateNode = node.querySelector("pubDate, published, updated, date");
                    let pubDate = new Date();
                    if (dateNode && dateNode.textContent) {
                        const parsedDate = new Date(dateNode.textContent);
                        if (!isNaN(parsedDate.getTime())) {
                            pubDate = parsedDate;
                        }
                    }

                    if (title && link !== "#") {
                        articles.push({
                            title,
                            link,
                            description,
                            pubDate,
                            feedName: feed.name,
                            category: feed.category || (title.toLowerCase().includes('nocode') ? 'NoCode' : 'IA')
                        });
                    }
                });

                return articles;
            }

            // Synchronisation progressive (met à jour la vue flux par flux)
            async function syncAllFeeds() {
                if (isSyncing) return;
                isSyncing = true;

                // UI loading
                syncStatusBanner.classList.remove('hidden');
                syncSpinIcon.classList.add('animate-spin');
                document.getElementById('mobile-refresh-icon').classList.add('animate-spin');
                document.getElementById('desktop-refresh-icon').classList.add('animate-spin');
                syncIndicator.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
                lastUpdatedText.textContent = 'Synchronisation...';

                let completed = 0;
                let newArticlesFound = 0;

                for (const feed of rssFeeds) {
                    feedStatus[feed.url] = 'loading';
                    renderFeedsList();
                    syncProgress.textContent = `${completed + 1} / ${rssFeeds.length}`;

                    try {
                        const xmlText = await fetchRssContent(feed.url);
                        const items = parseRssString(xmlText, feed);

                        if (items.length > 0) {
                            feedStatus[feed.url] = 'ok';
                            
                            // Fusion sans doublons par lien
                            const existingLinks = new Set(allArticles.map(a => a.link));
                            items.forEach(newItem => {
                                if (!existingLinks.has(newItem.link)) {
                                    allArticles.push(newItem);
                                    existingLinks.add(newItem.link);
                                    newArticlesFound++;
                                }
                            });
                            
                            // Affichage progressif
                            renderArticles();
                        } else {
                            feedStatus[feed.url] = 'error';
                        }
                    } catch (e) {
                        console.warn(`Échec de récupération pour ${feed.name}:`, e.message);
                        feedStatus[feed.url] = 'error';
                    }

                    completed++;
                    renderFeedsList();
                }

                // Fin de synchro
                isSyncing = false;
                syncSpinIcon.classList.remove('animate-spin');
                document.getElementById('mobile-refresh-icon').classList.remove('animate-spin');
                document.getElementById('desktop-refresh-icon').classList.remove('animate-spin');
                syncStatusBanner.classList.add('hidden');
                syncIndicator.className = 'w-2 h-2 rounded-full bg-emerald-500';

                const now = new Date();
                lastUpdatedText.textContent = `Actualisé à ${now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;

                showToast(newArticlesFound > 0 ? `${newArticlesFound} nouveaux articles récupérés !` : "Veille à jour");
            }

            // Gestion de l'ajout de flux personnalisé
            function handleAddFeed() {
                const url = rssUrlInput.value.trim();
                if (!url) {
                    showToast("Veuillez saisir une URL valide", "⚠️");
                    return;
                }

                try {
                    new URL(url);
                } catch (_) {
                    showToast("L'adresse URL semble incorrecte", "⚠️");
                    return;
                }

                if (rssFeeds.some(f => f.url.toLowerCase() === url.toLowerCase())) {
                    showToast("Ce flux est déjà enregistré", "ℹ️");
                    return;
                }

                // Déduction du nom
                let hostName = 'Flux';
                try {
                    const parsedUrl = new URL(url);
                    hostName = parsedUrl.hostname.replace('www.', '').split('.')[0];
                    hostName = hostName.charAt(0).toUpperCase() + hostName.slice(1);
                } catch (_) {}

                const newFeed = {
                    id: Date.now().toString(),
                    name: hostName,
                    url: url,
                    category: 'IA'
                };

                rssFeeds.push(newFeed);
                saveFeeds();
                rssUrlInput.value = '';
                renderFeedsList();
                showToast(`Flux "${hostName}" ajouté !`);
                syncAllFeeds();
            }

            // Bascule UI des tags
            function updateTagUI() {
                document.querySelectorAll('.tag-btn').forEach(btn => {
                    const tag = btn.dataset.tag;
                    if (tag === currentTag) {
                        btn.className = 'tag-btn text-xs px-3 py-1.5 rounded-lg font-semibold bg-indigo-600 text-white shadow-sm transition-colors';
                    } else if (tag === 'favoris') {
                        btn.className = 'tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-amber-50 text-amber-700 hover:bg-amber-100 transition-colors';
                    } else {
                        btn.className = 'tag-btn text-xs px-3 py-1.5 rounded-lg font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors';
                    }
                });
            }

            // Gestion du menu burger mobile
            function toggleSidebar(forceClose = false) {
                const isOpen = !sidebar.classList.contains('-translate-x-full');
                if (forceClose || isOpen) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                    document.body.classList.remove('overflow-hidden');
                } else {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                    document.body.classList.add('overflow-hidden');
                }
            }

            // Écouteurs d'événements UI
            burgerBtn.addEventListener('click', () => toggleSidebar());
            closeSidebarBtn.addEventListener('click', () => toggleSidebar(true));
            overlay.addEventListener('click', () => toggleSidebar(true));

            addFeedBtn.addEventListener('click', handleAddFeed);
            rssUrlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleAddFeed();
            });

            // Filtre temps réel
            filterInput.addEventListener('input', () => {
                clearSearchBtn.classList.toggle('hidden', !filterInput.value);
                renderArticles();
            });

            clearSearchBtn.addEventListener('click', () => {
                filterInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderArticles();
                filterInput.focus();
            });

            // Boutons de réinitialisation
            resetFeedsBtn.addEventListener('click', () => {
                rssFeeds = [...defaultFeeds];
                saveFeeds();
                renderFeedsList();
                showToast("15 flux réinitialisés par défaut !");
                syncAllFeeds();
            });

            // Boutons de rafraîchissement
            syncAllBtn.addEventListener('click', syncAllFeeds);
            mobileRefreshBtn.addEventListener('click', syncAllFeeds);
            desktopRefreshBtn.addEventListener('click', syncAllFeeds);

            // Tags thématiques
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentTag = btn.dataset.tag;
                    updateTagUI();
                    renderArticles();
                });
            });

            // Initialisation
            favCountEl.textContent = favorites.length;
            renderFeedsList();
            renderArticles();
            updateTagUI();

            // Lancement de la synchronisation automatique
            syncAllFeeds();

            // Rafraîchissement automatique toutes les 15 minutes
            setInterval(syncAllFeeds, 15 * 60 * 1000);
        });
    </script>
