                script: "Merci à tous pour votre énergie et votre implication ce matin ! Nous arrivons au terme de cette session BGE. J'ai condensé nos dernières slides pour vous offrir cette vue d'ensemble récapitulative. Vous avez mes coordonnées directes à gauche pour vos futures questions sur la mise en place de votre routine du lundi. Et à droite, n'hésitez pas à rejoindre nos différents réseaux d'entrepreneurs régionaux pour rester connectés à notre actualité. N'oubliez pas de compléter vos fiches d'évaluation avant de quitter la salle. À vos claviers dès lundi pour votre premier sprint de communication !"
            }
        ];

        // VARIABLES D'ÉTAT GLOBALES
        let currentSlideIndex = 0;
        let timerInterval = null;
        let timerSecondsRemaining = 1800; // Par défaut 30 minutes
        let timerIsRunning = false;
        let consoleIsVisible = true; // Pour basculer entre mode présentateur et diaporama seul

        window.onload = function () {
            // Lecture de la slide d'origine si présente dans l'URL ou localStorage
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            
            // Si c'est l'affichage présentateur, on configure l'interface présentateur
            if (role === 'presenter' || window.name === 'bge_presenter_view') {
                document.getElementById('main-header').style.display = 'none';
                document.getElementById('slide-viewer-pane').style.display = 'none';
                document.getElementById('presenter-sidebar').classList.remove('w-[380px]', 'md:w-[460px]');
                document.getElementById('presenter-sidebar').classList.add('w-full', 'h-full');
            }

            buildSlidesGridSelector();
            
            // Écoute de la synchronisation instantanée via le stockage partagé
            window.addEventListener('storage', handleStorageEvent);
            
            // Récupérer la slide de départ
            const savedSlide = localStorage.getItem('bge_current_slide');
            if (savedSlide !== null) {
                currentSlideIndex = parseInt(savedSlide, 10);
            }
            
            renderSlide(currentSlideIndex);
            initNavigation();
            setTimerDuration(1800); // 30 min par défaut
        };

        // Gérer la synchronisation entre les deux fenêtres
        function handleStorageEvent(event) {
            if (event.key === 'bge_current_slide' && event.newValue !== null) {
                const newIndex = parseInt(event.newValue, 10);
                if (newIndex !== currentSlideIndex) {
                    renderSlide(newIndex);
                }
            }
            if (event.key === 'bge_timer_seconds' && event.newValue !== null) {
                timerSecondsRemaining = parseInt(event.newValue, 10);
                updateTimerDisplay();
            }
            if (event.key === 'bge_timer_running' && event.newValue !== null) {
                const running = event.newValue === 'true';
                if (running !== timerIsRunning) {
                    if (running) {
                        startTimerInterval();
                    } else {
                        stopTimerInterval();
                    }
                }
            }
        }

        // Construction du rendu de la slide sélectionnée
        function renderSlide(index) {
            if (index < 0 || index >= slidesDatabase.length) return;
            currentSlideIndex = index;

            const slide = slidesDatabase[index];

            // Mise à jour de l'en-tête de slide
            document.getElementById("slide-category-badge").innerText = slide.category;
            document.getElementById("slide-sub-badge").innerText = slide.subBadge;

            // Mise à jour du contenu principal avec un wrapper flexible empêchant le défilement
            const mainContentContainer = document.getElementById("slide-main-content");
            mainContentContainer.innerHTML = `
                <h3 class="font-poppins font-black text-xl md:text-2xl text-bge-blue mb-3 tracking-tight leading-snug border-l-4 border-bge-orange pl-3 flex-shrink-0">
                    ${slide.title}
                </h3>
                <div class="slide-body-content text-slate-700 leading-relaxed text-xs md:text-sm font-lato overflow-hidden">
                    ${slide.content}
                </div>
            `;

            // Mise à jour du pied de page
            document.getElementById("slide-footer-right").innerText = `Séquence ${slide.category} • Slide ${slide.id} / 33`;

            // Compteur global de l'en-tête de l'application
            document.getElementById("global-slide-counter").innerText = `Slide ${slide.id} / 33`;

            // Mise à jour des notes d'animation du formateur
            const presenterNotes = document.getElementById("presenter-notes");
            presenterNotes.innerHTML = slide.script.replace(/\n/g, "<br>");
            // Auto scroll vers le haut des notes
            presenterNotes.scrollTop = 0;

            // Mettre en valeur le bouton de slide dans la grille
            updateGridActiveIndicator(index);

            // Synchroniser la slide sur localStorage
            localStorage.setItem('bge_current_slide', index.toString());
        }

        // Changement de slide de manière sécurisée
        function navigateSlide(direction) {
            const targetIndex = currentSlideIndex + direction;
            if (targetIndex >= 0 && targetIndex < slidesDatabase.length) {
                renderSlide(targetIndex);
            }
        }

        // Raccourcis claviers pour naviguer
        function initNavigation() {
            document.addEventListener("keydown", function (e) {
                if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
                    e.preventDefault();
                    navigateSlide(1);
                } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
                    e.preventDefault();
                    navigateSlide(-1);
                }
            });
        }

        // Construction dynamique de la grille de boutons pour les 33 slides
        function buildSlidesGridSelector() {
            const container = document.getElementById("slides-grid-container");
            container.innerHTML = ""; // Vider avant reconstruction

            for (let i = 0; i < slidesDatabase.length; i++) {
                const btn = document.createElement("button");
                btn.id = `grid-btn-${i}`;
                btn.innerText = i + 1;
                btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-bold py-1 rounded transition-all duration-200 text-center";
                btn.onclick = function () {
                    renderSlide(i);
                };
                container.appendChild(btn);
            }
        }

        // Mettre en évidence la slide courante sur la grille
        function updateGridActiveIndicator(activeIndex) {
            for (let i = 0; i < slidesDatabase.length; i++) {
                const btn = document.getElementById(`grid-btn-${i}`);
                if (btn) {
                    if (i === activeIndex) {
                        btn.className = "bg-bge-orange text-white text-xs font-black py-1.5 rounded shadow-lg scale-105 border border-white/20 text-center";
                    } else {
                        btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-bold py-1.5 rounded transition-all duration-200 text-center";
                    }
                }
            }
        }

        // GESTION DU MINUTEUR ET COMPTE À REBOURS
        function setTimerDuration(seconds) {
            stopTimerInterval();
            timerSecondsRemaining = seconds;
            updateTimerDisplay();
            localStorage.setItem('bge_timer_seconds', seconds.toString());
        }

        function toggleTimer() {
            if (timerIsRunning) {
                stopTimerInterval();
            } else {
                startTimerInterval();
            }
        }

        function startTimerInterval() {
            if (timerInterval) clearInterval(timerInterval);
            timerIsRunning = true;
            document.getElementById("timer-btn").innerText = "Pause";
            document.getElementById("timer-btn").className = "bg-red-600 hover:bg-red-700 text-[10px] md:text-xs font-bold py-2 rounded-lg text-white shadow-md transition-all";
            
            localStorage.setItem('bge_timer_running', 'true');

            timerInterval = setInterval(function () {
                if (timerSecondsRemaining > 0) {
                    timerSecondsRemaining--;
                    updateTimerDisplay();
                    localStorage.setItem('bge_timer_seconds', timerSecondsRemaining.toString());
                } else {
                    stopTimerInterval();
                    // Alerte douce pour la fin de l'atelier
                    document.getElementById("timer-display").innerText = "FINI !";
                }
            }, 1000);
        }

        function stopTimerInterval() {
            timerIsRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById("timer-btn").innerText = "Lancer";
            document.getElementById("timer-btn").className = "bg-bge-orange hover:bg-orange-600 text-[10px] md:text-xs font-bold py-2 rounded-lg text-white shadow-md transition-all";
            localStorage.setItem('bge_timer_running', 'false');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSecondsRemaining / 60);
            const secs = timerSecondsRemaining % 60;
            const displayStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            document.getElementById("timer-display").innerText = displayStr;

            // Calcul de la barre de progression (base 30 minutes / 1800s par défaut)
            const progressPercent = (timerSecondsRemaining / 1800) * 100;
            document.getElementById("timer-progress").style.width = `${Math.min(progressPercent, 100)}%`;
        }

        // GESTION DU MODE PRÉSENTATEUR INDÉPENDANT (DOUBLE ÉCRAN)
        function openPresenterWindow() {
            // Ouvre l'application dans une nouvelle fenêtre indépendante en lui passant le rôle présentateur
            const path = window.location.pathname + '?role=presenter';
            window.open(path, 'bge_presenter_view', 'width=1200,height=800,toolbar=no,menubar=no,scrollbars=no,resizable=yes');
        }

        // MASQUER / AFFICHER LA SIDEBAR DE NOTES SUR L'ÉCRAN PRINCIPAL
        function togglePresenterSidebar() {
            const sidebar = document.getElementById("presenter-sidebar");
            const showBtn = document.getElementById("show-sidebar-btn");

            if (consoleIsVisible) {
                sidebar.classList.add('w-0', 'border-l-0', 'opacity-0');
                sidebar.classList.remove('w-[380px]', 'md:w-[460px]');
                showBtn.classList.remove('hidden');
                consoleIsVisible = false;
            } else {
                sidebar.classList.remove('w-0', 'border-l-0', 'opacity-0');
                sidebar.classList.add('w-[380px]', 'md:w-[460px]');
                showBtn.classList.add('hidden');
                consoleIsVisible = true;
            }
        }

        // MODE PLEIN ÉCRAN
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Erreur de passage en plein écran: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
